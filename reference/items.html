<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <link rel="icon" type="image/x-icon" href="../favicon.ico">
    <title>Vowmon Wiki - 物品图鉴</title>
    <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fontsource-variable/inter@5/index.css">
    <script src="https://cdn.jsdelivr.net/npm/vue@3.5.13/dist/vue.global.prod.js"></script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fortawesome/fontawesome-free@6.4.0/css/all.min.css">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: 'Inter Variable', 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', 'HarmonyOS Sans SC', 'MiSans', 'Source Han Sans SC', 'Noto Sans SC', 'PingFang SC', 'Microsoft YaHei', system-ui, sans-serif; background: #f4f7f9; color: #333; min-height: 100vh; }
        .font-num { font-family: 'Inter Variable', 'Inter', -apple-system, 'Segoe UI', sans-serif; font-weight: 800; font-variant-numeric: tabular-nums; font-feature-settings: 'tnum' 1; letter-spacing: .01em; }
        a { color: inherit; text-decoration: none; }

        .container { max-width: 1180px; margin: 26px auto 40px; background: #fdfdfd; border-radius: 24px; padding: 28px 30px 34px; box-shadow: 0 1px 3px rgba(45,55,72,.04); }

        /* ---------------- 列表页 ---------------- */
        .page-head { display: flex; justify-content: space-between; align-items: flex-end; gap: 14px; margin-bottom: 18px; flex-wrap: wrap; }
        .page-head h1 { font-size: 26px; font-weight: 900; color: #2c3e50; display: flex; align-items: center; gap: 12px; }
        .page-head h1 .count { font-size: 12.5px; font-weight: 800; color: #b07d2b; background: #fdf3e0; border: 1px solid #f3dcb0; padding: 4px 12px; border-radius: 999px; }

        .kind-tabs { display: flex; gap: 8px; margin-bottom: 16px; flex-wrap: wrap; }
        .kind-tab { padding: 8px 20px; border-radius: 999px; border: 1px solid #eddfc6; background: #fff; color: #7a6a52; font-size: 14px; font-weight: 800; cursor: pointer; }
        .kind-tab.active { background: #fdf3e0; border-color: #e6bf76; color: #a8721c; box-shadow: 0 2px 8px rgba(214,158,63,.15); }

        .search-box { position: relative; margin-bottom: 16px; }
        .search-box .search-ico { position: absolute; left: 18px; top: 50%; transform: translateY(-50%); color: #c19a55; font-size: 15px; pointer-events: none; }
        .search-box input { width: 100%; padding: 13px 44px 13px 46px; border: 1.5px solid #eee3d0; border-radius: 14px; outline: none; font-size: 14.5px; font-weight: 700; background: #fff; transition: border-color .15s, box-shadow .15s; font-family: inherit; }
        .search-box input::placeholder { color: #b8bec7; font-weight: 600; }
        .search-box input:focus { border-color: #e6bf76; box-shadow: 0 0 0 4px rgba(230,191,118,.18); }
        .search-clear { position: absolute; right: 12px; top: 50%; transform: translateY(-50%); background: #f0f2f5; border: none; color: #718096; width: 22px; height: 22px; border-radius: 50%; cursor: pointer; display: flex; align-items: center; justify-content: center; font-size: 11px; }
        .search-clear:hover { background: #e2e8f0; color: #2d3748; }

        .group-bar { display: flex; flex-wrap: wrap; gap: 8px; padding: 12px 14px; background: #fdf8ee; border: 1px solid #f2e4cb; border-radius: 14px; margin-bottom: 16px; }
        .group-chip { display: inline-flex; align-items: center; gap: 6px; padding: 6px 14px; border-radius: 999px; border: 1px solid transparent; background: #fff; color: #5f5646; font-size: 13px; font-weight: 800; cursor: pointer; transition: transform .12s, box-shadow .12s; font-family: inherit; }
        .group-chip:hover { transform: translateY(-1px); box-shadow: 0 3px 8px rgba(180,140,60,.12); }
        .group-chip i { font-size: 11px; }
        .group-chip .badge { font-size: 11px; color: #b0a288; font-weight: 800; }
        .group-chip.active { background: #f5d79a; border-color: #e6bf76; color: #7a5510; }
        .group-chip.active .badge { color: #8a6418; }

        .result-row { display: flex; justify-content: space-between; align-items: center; margin-bottom: 14px; flex-wrap: wrap; gap: 10px; }
        .result-text { font-size: 13px; font-weight: 800; color: #9aa3ad; }
        .result-text b { color: #dd6b20; }
        .sort-select { padding: 8px 12px; border: 1px solid #e6e9ee; border-radius: 10px; background: #fff; color: #4a5568; font-size: 13px; font-weight: 700; font-family: inherit; cursor: pointer; outline: none; }

        .item-grid { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 14px; }
        .item-card { display: flex; gap: 14px; align-items: flex-start; padding: 14px 16px; background: #fff; border: 1px solid #eef1f5; border-radius: 14px; transition: transform .16s, box-shadow .16s, border-color .16s; }
        .item-card:hover { transform: translateY(-2px); border-color: #f0d9ae; box-shadow: 0 6px 18px rgba(180,140,60,.1); }
        .item-icon { flex-shrink: 0; width: 54px; height: 54px; border-radius: 12px; background: #faf6ee; border: 1px solid #f4ecdd; display: flex; align-items: center; justify-content: center; overflow: hidden; }
        .item-icon img { width: 100%; height: 100%; object-fit: contain; padding: 6px; }
        .item-icon i { font-size: 24px; }
        .item-card-body { min-width: 0; }
        .item-card-name { font-size: 15.5px; font-weight: 900; color: #2d3748; margin-bottom: 4px; }
        .item-card-desc { font-size: 12.5px; line-height: 1.6; color: #8b929b; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }

        .empty-state { text-align: center; padding: 60px 20px; color: #a0aec0; font-weight: 700; }
        .empty-state i { display: block; font-size: 30px; margin-bottom: 12px; color: #d3d9e0; }

        /* ---------------- 详情页 ---------------- */
        .crumb-row { display: flex; align-items: center; gap: 6px; margin-bottom: 14px; flex-wrap: wrap; }
        .crumb { display: inline-flex; align-items: center; gap: 6px; font-size: 13px; font-weight: 800; color: #a8895a; }
        .card-share-btn { margin-left: auto; flex: none; display: inline-flex; align-items: center; gap: 7px; height: 34px; padding: 0 15px; border: 1px solid #e6cf9a; border-radius: 999px; background: #fffdf5; color: #9c6b0e; font-size: 12.5px; font-weight: 900; font-family: inherit; cursor: pointer; transition: all .15s; }
        .card-share-btn:hover { background: #fff7e2; border-color: #d9b463; transform: translateY(-1px); }
        .crumb:hover { color: #dd6b20; }
        .crumb-sep { color: #d9cbb4; margin: 0 2px; }
        .crumb-current { font-size: 13px; font-weight: 800; color: #b9a582; }

        .detail-title { font-size: 32px; font-weight: 900; color: #2c3e50; margin-bottom: 20px; letter-spacing: .5px; }

        .detail-card { display: grid; grid-template-columns: 210px minmax(0, 1fr); gap: 34px; background: #fdfaf4; border: 1px solid #f2e6cf; border-radius: 20px; padding: 28px; margin-bottom: 34px; }
        .detail-icon { width: 210px; height: 210px; border-radius: 16px; background: #fbf2e0; border: 1px solid #f2e2c2; display: flex; align-items: center; justify-content: center; overflow: hidden; }
        .detail-icon img { width: 100%; height: 100%; object-fit: contain; padding: 14px; }
        .detail-icon i { font-size: 96px; }

        .detail-cat { font-size: 12.5px; font-weight: 900; color: #c08a2a; letter-spacing: .5px; margin-bottom: 10px; }
        .detail-desc { font-size: 15px; line-height: 1.85; color: #4a5568; font-weight: 600; }
        .detail-price { display: inline-flex; align-items: center; gap: 6px; margin-top: 6px; padding: 5px 12px; border-radius: 999px; background: #fffdf5; border: 1px solid #f0e5cd; color: #9c6b0e; font-size: 14px; font-weight: 900; }
        .detail-price i { font-size: 12px; color: #d4a017; }
        .detail-price span { font-size: 11px; font-weight: 800; color: #b7791f; }
        .detail-divider { height: 1px; background: #f0e3cb; margin: 20px 0 16px; }
        .obtain-title { font-size: 16px; font-weight: 900; color: #4a3c28; margin-bottom: 10px; }
        .obtain-list { list-style: none; display: flex; flex-direction: column; gap: 8px; }
        .obtain-list li { display: flex; align-items: center; gap: 8px; font-size: 13.5px; font-weight: 700; color: #6b5f4d; }
        .obtain-list li i { color: #d99b3f; font-size: 11px; }
        .obtain-empty { font-size: 13px; color: #a0aec0; font-weight: 700; }

        .more-title { font-size: 20px; font-weight: 900; color: #2c3e50; margin-bottom: 14px; }
        .more-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 14px; }
        .more-card { display: grid; grid-template-columns: 62px minmax(0, 1fr) 16px; gap: 14px; align-items: center; padding: 14px 16px; background: #fff; border: 1px solid #eef1f5; border-radius: 14px; transition: transform .16s, box-shadow .16s, border-color .16s; }
        .more-card:hover { transform: translateY(-2px); border-color: #f0d9ae; box-shadow: 0 6px 18px rgba(180,140,60,.1); }
        .more-card .item-icon { width: 62px; height: 62px; }
        .more-card .item-icon i { font-size: 27px; }
        .more-cat { font-size: 11.5px; font-weight: 900; color: #c08a2a; margin-bottom: 2px; }
        .more-name { font-size: 15px; font-weight: 900; color: #2d3748; margin-bottom: 2px; }
        .more-desc { font-size: 12.5px; color: #8b929b; line-height: 1.5; display: -webkit-box; -webkit-line-clamp: 1; -webkit-box-orient: vertical; overflow: hidden; }
        .more-arrow { color: #cbd5e0; font-size: 12px; }

        .breadcrumb-back { display: inline-flex; align-items: center; gap: 8px; font-size: 13.5px; font-weight: 800; color: #a8895a; padding: 8px 14px; border-radius: 999px; border: 1px solid #f0e3cb; background: #fff; }

        .no-anim *, .no-anim *::before, .no-anim *::after { transition: none !important; animation: none !important; }

        @media (max-width: 900px) {
            .container { padding: 20px 16px 26px; border-radius: 18px; margin: 14px 10px 24px; }
            .item-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); }
            .more-grid { grid-template-columns: 1fr; }
            .detail-card { grid-template-columns: 150px minmax(0, 1fr); gap: 22px; padding: 20px; }
            .detail-icon { width: 150px; height: 150px; }
            .detail-icon i { font-size: 68px; }
            .detail-title { font-size: 26px; }
        }
        @media (max-width: 640px) {
            .item-grid { grid-template-columns: 1fr; }
            .detail-card { grid-template-columns: 1fr; gap: 18px; }
            .detail-icon { width: 100%; height: 170px; }
            .detail-icon i { font-size: 72px; }
            .page-head h1 { font-size: 21px; }
            .detail-title { font-size: 23px; }
            .detail-desc { font-size: 14px; }
        }
    </style>
    <link rel="stylesheet" href="../css/navbar.css?v=20261126s">
    <script src="../js/navbar.js?v=20261128" defer></script>
    <link rel="stylesheet" href="../css/responsive.css?v=20261126s">
</head>
<body>

<div id="app">
    <div id="site-navbar"></div>

    <div class="container">
        <!-- ============================ 列表 ============================ -->
        <template v-if="!currentItem">
            <div class="page-head">
                <h1>物品图鉴 <span class="count font-num">{{ filteredItems.length }} / {{ kindItems.length }} 项</span></h1>
            </div>

            <div class="kind-tabs" v-if="kindTabs.length > 1">
                <button class="kind-tab" v-for="k in kindTabs" :key="k" :class="{ active: currentKind === k }" @click="selectKind(k)">{{ k }}</button>
            </div>

            <div class="search-box">
                <i class="fa-solid fa-magnifying-glass search-ico"></i>
                <input type="text" v-model="keyword" placeholder="搜索物品名称、描述或获取方式…">
                <button v-if="keyword" class="search-clear" @click="keyword = ''" title="清空搜索"><i class="fa-solid fa-xmark"></i></button>
            </div>

            <div class="group-bar">
                <button class="group-chip" :class="{ active: !currentGroup }" @click="currentGroup = ''">
                    <i :class="allIcon"></i> 全部道具 <span class="badge font-num">{{ kindItems.length }}</span>
                </button>
                <button class="group-chip" v-for="g in usedGroups" :key="g.name"
                        :class="{ active: currentGroup === g.name }" @click="toggleGroup(g.name)">
                    <i :class="g.icon" :style="{ color: g.color }"></i> {{ g.name }}
                    <span class="badge font-num">{{ getGroupCount(g.name) }}</span>
                </button>
            </div>

            <div class="result-row">
                <div class="result-text"><b class="font-num">{{ filteredItems.length }}</b> 项结果</div>
                <select class="sort-select" v-model="sortMode">
                    <option value="default">默认排序</option>
                    <option value="name">按名称</option>
                    <option value="group">按分组</option>
                </select>
            </div>

            <div class="item-grid" v-if="filteredItems.length">
                <a class="item-card" v-for="it in filteredItems" :key="it.id"
                   :href="'items.html?id=' + encodeURIComponent(it.id)" @click.prevent="openItem(it.id)">
                    <div class="item-icon">
                        <img v-if="it.icon" :src="iconUrl(it.icon)" :alt="it.name" loading="lazy">
                        <i v-else :class="it.iconClass" :style="{ color: it.color }"></i>
                    </div>
                    <div class="item-card-body">
                        <div class="item-card-name">{{ it.name }}</div>
                        <div class="item-card-desc">{{ it.desc || '暂无描述' }}</div>
                    </div>
                </a>
            </div>
            <div class="empty-state" v-else>
                <i class="fa-solid fa-box-open"></i>
                没有符合条件的物品，换个关键词或分组试试
            </div>
        </template>

        <!-- ============================ 详情 ============================ -->
        <template v-else>
            <div class="crumb-row">
                <a class="crumb" href="items.html" @click.prevent="backToList">
                    <i class="fa-solid fa-arrow-left"></i> 物品图鉴
                </a>
                <span class="crumb-sep">/</span>
                <span class="crumb-current">{{ currentItem.group }}</span>
                <button class="card-share-btn" @click="exportCard"><i class="fa-solid fa-id-card"></i> 生成卡片</button>
            </div>

            <h1 class="detail-title">{{ currentItem.name }}</h1>

            <div class="detail-card">
                <div class="detail-icon">
                    <img v-if="currentItem.icon" :src="iconUrl(currentItem.icon)" :alt="currentItem.name">
                    <i v-else :class="currentItem.iconClass" :style="{ color: currentItem.color }"></i>
                </div>
                <div class="detail-info">
                    <div class="detail-cat">{{ currentItem.category || currentItem.group }}</div>
                    <div class="detail-price" v-if="currentItem.price"><i class="fa-solid fa-coins"></i> {{ currentItem.price }} <span>{{ currentItem.currency || '联盟币' }}</span></div>
                    <p class="detail-desc">{{ currentItem.desc || '暂无描述。' }}</p>
                    <div class="detail-divider"></div>
                    <h3 class="obtain-title">获取方式</h3>
                    <ul class="obtain-list" v-if="currentItem.obtain.length">
                        <li v-for="o in currentItem.obtain" :key="o"><i class="fa-solid fa-location-dot"></i> {{ o }}</li>
                    </ul>
                    <p class="obtain-empty" v-else>暂未记录获取方式。</p>
                </div>
            </div>

            <template v-if="relatedItems.length">
                <h2 class="more-title">继续看看</h2>
                <div class="more-grid">
                    <a class="more-card" v-for="it in relatedItems" :key="it.id"
                       :href="'items.html?id=' + encodeURIComponent(it.id)" @click.prevent="openItem(it.id)">
                        <div class="item-icon">
                            <img v-if="it.icon" :src="iconUrl(it.icon)" :alt="it.name" loading="lazy">
                            <i v-else :class="it.iconClass" :style="{ color: it.color }"></i>
                        </div>
                        <div>
                            <div class="more-cat">{{ it.category || it.group }}</div>
                            <div class="more-name">{{ it.name }}</div>
                            <div class="more-desc">{{ it.desc }}</div>
                        </div>
                        <i class="fa-solid fa-chevron-right more-arrow"></i>
                    </a>
                </div>
            </template>
        </template>
    </div>
</div>

<script src="../js/site-config.js?v=20261127a"></script>
<!-- 数据先于配置引入：item-config 要读 items-data.js 里的自定义类型 / 分组 -->
<script src="../js/data-loader.js?v=20261128"></script>
<script src="../js/item-config.js?v=20261126s"></script>
<script src="../js/card-export.js?v=20261126s"></script>
<script>
    const { createApp, ref, computed, onMounted } = Vue;
VowmonData.ready(['items']).then(function () {

    createApp({
        setup() {
            /* ---------------------------------------------------- 图片基础路径 */
            // 物品图标在数据里存相对路径（items/i001.png），前台需要拼图片仓库的公开前缀。
            // 优先级：本机后台配置（localStorage）> 仓库里的 js/site-config.js。
            // 访客浏览器里没有 localStorage，只会用到 site-config.js 的值。
            const IMG_BASE = (() => {
                let local = {};
                try { local = JSON.parse(localStorage.getItem('vowmon_sync_config') || '{}') || {}; } catch (e) { local = {}; }
                const raw = String((local && local.imgCdnBase) || (window.VOWMON_SITE_CONFIG || {}).imgCdnBase || '');
                const base = raw.trim().replace(/\/+$/, '');
                return base ? base + '/' : '';
            })();

            const IMG_VER = (window.VOWMON_SITE_CONFIG || {}).imgVer ? '?v=' + window.VOWMON_SITE_CONFIG.imgVer : '';
            const iconUrl = (path) => {
                const p = String(path || '').trim();
                if (!p) return '';
                if (/^(https?:)?\/\//i.test(p) || p.startsWith('data:')) return p;
                return IMG_BASE + p.replace(/^\/+/, '') + IMG_VER;
            };

            // 数据规整：补默认值，保证 icon/obtain 等字段一定存在
            const toItem = (raw) => {
                const item = Object.assign({}, raw);
                item.id = String(item.id || '');
                item.name = String(item.name || '未命名物品').trim();
                item.kind = normalizeItemKind(item.kind);
                item.group = item.group && item.group.trim() ? item.group.trim() : ITEM_FALLBACK_GROUP.name;
                item.category = String(item.category || '').trim();
                item.icon = String(item.icon || '').trim();
                item.color = item.color || getItemFallbackColor(item);
                item.iconClass = item.iconClass || getItemFallbackIcon(item);
                item.desc = String(item.desc || '').trim();
                item.price = item.price == null ? '' : String(item.price).trim();
                item.currency = String(item.currency || '').trim() || '联盟币';
                item.obtain = Array.isArray(item.obtain)
                    ? item.obtain.map(o => String(o).trim()).filter(Boolean)
                    : (item.obtain ? [String(item.obtain)] : []);
                return item;
            };
            const items = ref((allItemsData || []).map(toItem));
            // 后台改了物品数据 → 这里立刻刷新，不用刷新页面
            VowmonData.onChange('items', (data) => {
                items.value = ((data && data.items) || allItemsData || []).map(toItem);
            });

            /* -------------------------------------------------------- 视图切换 */
            const currentId = ref('');
            const readIdFromUrl = () => {
                const id = new URLSearchParams(window.location.search).get('id') || '';
                currentId.value = id;
            };
            readIdFromUrl();

            const findItem = (id) => items.value.find(it => it.id === id) || null;
            const currentItem = computed(() => (currentId.value ? findItem(currentId.value) : null));

            const openItem = (id) => {
                if (!findItem(id)) return;
                currentId.value = id;
                window.history.pushState({ id }, '', 'items.html?id=' + encodeURIComponent(id));
                window.scrollTo(0, 0);
            };
            const backToList = () => {
                currentId.value = '';
                window.history.pushState({}, '', 'items.html');
                window.scrollTo(0, 0);
            };

            window.addEventListener('popstate', () => {
                readIdFromUrl();
                window.scrollTo(0, 0);
            });

            /* ---------------------------------------------------------- 筛选 */
            const keyword = ref('');
            const currentGroup = ref('');
            const sortMode = ref('default');

            // 有数据的大类才出现在 Tab 上；只有一个大类时整条 Tab 栏隐藏
            const kindTabs = computed(() => itemKinds.filter(k => items.value.some(it => it.kind === k)));
            const currentKind = ref(kindTabs.value[0] || itemKinds[0]);
            const selectKind = (kind) => {
                currentKind.value = kind;
                currentGroup.value = '';
            };

            const kindItems = computed(() => items.value.filter(it => it.kind === currentKind.value));

            // 只在当前大类里、且确实有物品的分组才显示（和技能标签的「只显示用到的」一致）
            const usedGroups = computed(() => {
                const count = new Map();
                kindItems.value.forEach(it => count.set(it.group, (count.get(it.group) || 0) + 1));
                return itemGroups.filter(g => count.get(g.name) > 0);
            });

            const getGroupCount = (name) => kindItems.value.filter(it => it.group === name).length;

            const toggleGroup = (name) => {
                currentGroup.value = currentGroup.value === name ? '' : name;
            };

            const filteredItems = computed(() => {
                const kw = keyword.value.trim().toLowerCase();
                let list = kindItems.value.filter(it => {
                    const matchGroup = !currentGroup.value || it.group === currentGroup.value;
                    const hay = [it.name, it.desc, it.category, it.group, ...it.obtain].join(' ').toLowerCase();
                    return matchGroup && (!kw || hay.includes(kw));
                });

                if (sortMode.value === 'name') {
                    list = list.slice().sort((a, b) => a.name.localeCompare(b.name, 'zh-CN'));
                } else if (sortMode.value === 'group') {
                    const order = itemGroups.map(g => g.name);
                    list = list.slice().sort((a, b) => order.indexOf(a.group) - order.indexOf(b.group));
                }
                return list;
            });

            /* -------------------------------------------------------- 继续看看 */
            // 同分组的其它物品优先，不足 4 个时用同大类的其它物品补齐
            const relatedItems = computed(() => {
                const cur = currentItem.value;
                if (!cur) return [];
                const sameGroup = items.value.filter(it => it.id !== cur.id && it.group === cur.group);
                const sameKind = items.value.filter(it => it.id !== cur.id && it.group !== cur.group && it.kind === cur.kind);
                return sameGroup.concat(sameKind).slice(0, 4);
            });

            /* 导出道具卡（TCG 卡牌风格：大图 + 分类/售价 + 说明） */
            const exportCard = () => {
                const it = currentItem.value;
                if (!it || !window.VowmonCard) return;
                const ability = {
                    tag: '分类',
                    name: it.category || it.group || '道具',
                    text: [it.kind ? '大类：' + it.kind : '', it.price ? '售价：' + it.price + ' ' + (it.currency || '联盟币') : ''].filter(Boolean).join('　')
                };
                window.VowmonCard.open({
                    label: '道具',
                    name: it.name,
                    badgeLabel: it.price ? 'PRICE' : 'ITEM',
                    badgeValue: it.price ? String(it.price) : '—',
                    types: [{ name: it.group || '道具', color: '#b7791f', icon: 'fa-solid fa-flask' }],
                    image: it.icon ? iconUrl(it.icon) : '',
                    ability: (ability.name || ability.text) ? ability : null,
                    sections: ['ability', 'desc'],
                    secLabels: { ability: '分类与售价', desc: '物品说明' },
                    desc: it.desc || '',
                    descLabel: '物品说明',
                    accent: '#b7791f',
                    variant: 'item',
                    footLeft: '',
                    footRight: 'VOWMON WIKI'
                });
            };

            onMounted(() => {
                if (localStorage.getItem('vowmon_anim_on') === 'false') {
                    document.body.classList.add('no-anim');
                }
                // 深链带了 id 但数据里没有：退回列表，避免空白页
                if (currentId.value && !findItem(currentId.value)) {
                    window.history.replaceState({}, '', 'items.html');
                    currentId.value = '';
                }
            });

            return {
                allIcon: ITEM_ALL_ICON,
                items, currentItem, relatedItems, iconUrl,
                openItem, backToList,
                keyword, currentGroup, currentKind, kindTabs, kindItems, usedGroups, selectKind,
                filteredItems, getGroupCount, toggleGroup, sortMode,
                exportCard
            };
        }
    }).mount('#app');
});
</script>
</body>
</html>
