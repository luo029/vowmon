<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <link rel="icon" type="image/x-icon" href="../favicon.ico">
    <title>Vowmon Wiki - 特性大全</title>
    <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fontsource-variable/inter@5/index.css">
    <script src="https://cdn.jsdelivr.net/npm/vue@3.5.13/dist/vue.global.prod.js"></script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fortawesome/fontawesome-free@6.4.0/css/all.min.css">
    <style>
        /* 复用 skills.html 的大部分样式，仅做微调 */
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: 'Inter Variable', 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', 'HarmonyOS Sans SC', 'MiSans', 'Source Han Sans SC', 'Noto Sans SC', 'PingFang SC', 'Microsoft YaHei', system-ui, sans-serif; background: #f4f7f9; color: #333; min-height: 100vh; }
        .font-num { font-family: 'Inter Variable', 'Inter', -apple-system, 'Segoe UI', sans-serif; font-weight: 800; font-variant-numeric: tabular-nums; font-feature-settings: 'tnum' 1; letter-spacing: .01em; }
        .navbar { background: #ffffff; border-bottom: 1px solid #e2e8f0; position: sticky; top: 0; z-index: 1000; }
        .nav-container { max-width: 1200px; margin: 0 auto; display: flex; justify-content: space-between; align-items: center; height: 70px; padding: 0 20px; position: relative; }
        .logo { color: #2c3e50; font-size: 22px; font-weight: 900; display: flex; align-items: center; gap: 10px; cursor: pointer; }
        .logo-svg { width: 38px; height: 38px; }
        .nav-links { position: absolute; left: 50%; transform: translateX(-50%); display: flex; align-items: center; }
        .nav-links a { display: block; color: #546e7a; text-decoration: none; font-size: 16px; font-weight: 600; padding: 10px 18px; border-radius: 8px; }
        .nav-links a:hover, .nav-links a.active { color: #ff6b6b; background: #fff5f5; }
        .container { max-width: 1200px; margin: 30px auto; background: #fdfdfd; border-radius: 24px; padding: 30px; }
        .header { display: flex; justify-content: space-between; align-items: flex-end; margin-bottom: 20px; }
        .header h2 { font-size: 24px; color: #2c3e50; font-weight: 900; }
        .filter-area { background: #fffdf8; border: 1px solid #fcecd7; border-radius: 16px; padding: 25px; margin-bottom: 25px; }
        .filter-top { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; border-bottom: 1px dashed #fcecd7; padding-bottom: 15px; }
        .filter-title { font-size: 18px; font-weight: 900; color: #2c3e50; }
        .clear-btn { background: none; border: none; color: #dd6b20; font-size: 14px; cursor: pointer; font-weight: bold; }
        .search-row { display: flex; margin-bottom: 20px; }
        .search-box { flex: 1; position: relative; }
        .search-box i { position: absolute; left: 18px; top: 50%; transform: translateY(-50%); color: #a0aec0; }
        .search-box input { width: 100%; padding: 14px 20px 14px 45px; border: 1px solid #e2e8f0; border-radius: 12px; outline: none; font-size: 15px; background: #fff; }
        .filter-row { display: flex; align-items: flex-start; margin-bottom: 15px; }
        .filter-label { font-size: 14px; font-weight: bold; color: #4a5568; min-width: 80px; padding-top: 8px; }
        .filter-options { display: flex; flex-wrap: wrap; gap: 10px; flex: 1; }
        .type-btn-icon { display: flex; align-items: center; gap: 8px; padding: 6px 14px 6px 8px; border-radius: 20px; border: 1px solid #e2e8f0; background: #fff; color: #4a5568; cursor: pointer; font-size: 13px; font-weight: bold; }
        .type-btn-icon.active { border-color: #ff6b6b; background: #fff5f5; color: #ff6b6b; }
        .type-icon-svg { display: flex; align-items: center; justify-content: center; width: 22px; height: 22px; border-radius: 50%; color: #fff; font-size: 11px; }
        .type-btn-icon .count-badge { background: #edf2f7; color: #718096; font-size: 12px; padding: 2px 8px; border-radius: 12px; font-weight: normal; }
        .table-wrapper { background: #fff; border-radius: 16px; overflow: hidden; border: 1px solid #e2e8f0; isolation: isolate; }
        table { width: 100%; border-collapse: collapse; }
        thead { background: #2d3748; color: #fff; }
        th { padding: 16px 15px; text-align: left; font-size: 14px; font-weight: bold; letter-spacing: 1px; }
        /* td 自带白底，行 hover 只改 td 背景：重绘锁在一行内，不会透出 wrapper 白底闪一下 */
        td { padding: 15px; border-bottom: 1px solid #edf2f7; font-size: 14px; color: #4a5568; background: #fff; }
        tbody tr:hover td { background: #f7fafc; }
        .trait-name { font-weight: 900; color: #2d3748; }
        .type-icon { display: inline-flex; align-items: center; justify-content: center; width: 24px; height: 24px; border-radius: 50%; color: #fff; font-size: 12px; margin-right: 4px;}
        .pokemon-tag { display: inline-block; background: #edf2f7; color: #4a5568; padding: 2px 8px; border-radius: 12px; font-size: 12px; margin-right: 5px; font-weight: bold; }
        .no-anim *, .no-anim *::before, .no-anim *::after { transition: none !important; animation: none !important; }
    </style>
    <link rel="stylesheet" href="../css/navbar.css?v=20261126s">
    <script src="../js/navbar.js?v=20261127d" defer></script>
    <link rel="stylesheet" href="../css/responsive.css?v=20261126s">
</head>
<body>

<div id="app">
    <div id="site-navbar"></div>

    <div class="container">
        <div class="header">
            <h2>特性列表</h2>
        </div>

        <div class="filter-area">
            <div class="filter-top">
                <div><span class="filter-title">筛选特性</span></div>
                <button class="clear-btn" @click="clearFilters">清空筛选</button>
            </div>
            <div class="search-row">
                <div class="search-box">
                    <i class="fa-solid fa-magnifying-glass"></i>
                    <input type="text" v-model="searchName" placeholder="输入名称、效果或精灵...">
                </div>
            </div>
            <div class="filter-row">
                <div class="filter-label">携带精灵系别</div>
                <div class="filter-options">
                    <div v-for="t in typeData" :key="t.name" class="type-btn-icon" :class="{active: selectedTypes.includes(t.name)}" @click="toggleType(t.name)">
                        <div class="type-icon-svg" :style="{ backgroundColor: t.color }"><i :class="t.icon"></i></div>
                        {{ t.name }} <span class="count-badge font-num">{{ getTypeCount(t.name) }}</span>
                    </div>
                </div>
            </div>
        </div>

        <div class="table-wrapper">
            <table>
                <thead>
                    <tr>
                        <th>特性名称</th>
                        <th>携带精灵系别</th>
                        <th>拥有精灵</th>
                        <th style="width: 40%;">特性效果</th>
                    </tr>
                </thead>
                <tbody>
                    <tr v-for="trait in filteredTraits" :key="trait.id">
                        <td class="trait-name">{{ trait.name }}</td>
                        <td>
                            <span class="type-icon" v-for="t in trait.types" :key="t" :style="{backgroundColor: getTypeColor(t)}"><i :class="getTypeIcon(t)"></i></span>
                        </td>
                        <td>
                            <span class="pokemon-tag" v-for="poke in trait.pokemons.slice(0, 3)" :key="poke">{{ poke }}</span>
                            <span v-if="trait.pokemons.length > 3" style="color:#a0aec0; font-size:12px;">...</span>
                        </td>
                        <td style="color: #718096;">{{ trait.effect }}</td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>
</div>

<script src="../js/type-config.js?v=20261126s"></script>
<script src="../js/data-loader.js?v=20261126w"></script>
<script>
    const { createApp, ref, computed, onMounted } = Vue;
VowmonData.ready(['traits']).then(function () {

    createApp({
        setup() {
            const traits = ref(allTraitsData);
            const searchName = ref('');
            const selectedTypes = ref([]);

            onMounted(() => {
                const isAnimOn = localStorage.getItem('vowmon_anim_on') !== 'false';
                if (!isAnimOn) document.body.classList.add('no-anim');
            });

            // 属性查找走 Map：列表里每条都要取色 / 取图标，避免每次 find 扫一遍 typeData
            const typeMap = new Map(typeData.map(t => [t.name, t]));
            const getTypeColor = (type) => (typeMap.get(type) || {}).color || '#ccc';
            const getTypeIcon = (type) => (typeMap.get(type) || {}).icon || '';

            const toggleType = (name) => {
                const i = selectedTypes.value.indexOf(name);
                i > -1 ? selectedTypes.value.splice(i, 1) : selectedTypes.value.push(name);
            };
            const clearFilters = () => {
                searchName.value = '';
                selectedTypes.value = [];
            };
            const getTypeCount = (type) => traits.value.filter(t => t.types.includes(type)).length;

            const filteredTraits = computed(() => {
                return traits.value.filter(t => {
                    const matchSearch = t.name.includes(searchName.value) || t.effect.includes(searchName.value) || t.pokemons.some(p => p.includes(searchName.value));
                    const matchType = selectedTypes.value.length === 0 || selectedTypes.value.some(st => t.types.includes(st));
                    return matchSearch && matchType;
                });
            });

            return { searchName, selectedTypes, typeData, filteredTraits, toggleType, clearFilters, getTypeCount, getTypeColor, getTypeIcon };
        }
    }).mount('#app');
});
</script>
</body>
</html>
