<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <link rel="icon" type="image/x-icon" href="favicon.ico">
    <title>Vowmon Wiki - 御兽人物档案</title>
    <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fontsource-variable/inter@5/index.css">
    <script src="https://cdn.jsdelivr.net/npm/vue@3.5.13/dist/vue.global.prod.js"></script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fortawesome/fontawesome-free@6.4.0/css/all.min.css">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: 'Inter Variable', 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', 'HarmonyOS Sans SC', 'MiSans', 'Source Han Sans SC', 'Noto Sans SC', 'PingFang SC', 'Microsoft YaHei', system-ui, sans-serif; background: #f4f7f9; color: #333; min-height: 100vh; }
        .font-num { font-family: 'Inter Variable', 'Inter', -apple-system, 'Segoe UI', sans-serif; font-weight: 800; font-variant-numeric: tabular-nums; font-feature-settings: 'tnum' 1; letter-spacing: .01em; }

        .container { max-width: 1200px; margin: 26px auto 40px; padding: 0 20px; }
        .header { display: flex; justify-content: space-between; align-items: flex-end; margin-bottom: 18px; border-bottom: 2px solid #f0f4f8; padding-bottom: 15px; }
        .header h2 { font-size: 24px; color: #2c3e50; font-weight: 900; }
        .header .count { font-size: 14px; color: #a0aec0; margin-left: 10px; font-weight: normal; }

        /* 筛选区 */
        .filter-bar { background: #fffdf8; border: 1px solid #fcecd7; border-radius: 16px; padding: 16px 20px; margin-bottom: 22px; display: flex; flex-wrap: wrap; gap: 12px; align-items: center; }
        .filter-bar .search-box { position: relative; flex: 1; min-width: 200px; }
        .filter-bar .search-box i { position: absolute; left: 14px; top: 50%; transform: translateY(-50%); color: #a0aec0; font-size: 14px; }
        .filter-bar .search-box input { width: 100%; padding: 10px 14px 10px 38px; border: 1px solid #e2e8f0; border-radius: 12px; outline: none; font-size: 14px; background: #fff; font-family: inherit; transition: border-color .2s; }
        .filter-bar .search-box input:focus { border-color: #185FA5; }
        .filter-select { padding: 10px 14px; border: 1px solid #e2e8f0; border-radius: 12px; background: #fff; font-size: 13.5px; font-weight: 700; color: #4a5568; outline: none; cursor: pointer; font-family: inherit; }

        /* 人物卡墙 */
        .cha-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); gap: 15px; }
        .cha-card { background: #fff; border-radius: 14px; border: 1px solid #e2e8f0; overflow: hidden; cursor: pointer; transition: transform .2s, box-shadow .2s, border-color .2s; }
        .cha-card:hover { transform: translateY(-4px); box-shadow: 0 10px 20px rgba(0,0,0,.08); border-color: #185FA5; }
        .cha-card .cc-top { background: linear-gradient(135deg, #185FA5 0%, #378ADD 100%); color: #fff; padding: 16px 18px 14px; position: relative; overflow: hidden; }
        .cha-card .cc-top::after { content: ''; position: absolute; right: -36px; top: -40px; width: 110px; height: 110px; border-radius: 50%; background: rgba(255,255,255,.12); }
        .cha-card .cc-name { font-size: 18px; font-weight: 900; display: flex; align-items: center; gap: 8px; }
        .cha-card .cc-title { margin-top: 5px; font-size: 11.5px; font-weight: 800; opacity: .85; }
        .cha-card .cc-body { padding: 13px 16px 15px; }
        .cha-card .cc-faction { font-size: 12.5px; font-weight: 800; color: #14538f; display: flex; align-items: center; gap: 6px; }
        .cha-card .cc-money { margin-top: 9px; display: flex; align-items: center; gap: 7px; font-size: 13px; font-weight: 900; color: #a3720b; }
        .cha-card .cc-money i { color: #d4a017; font-size: 12px; }
        .cha-card .cc-pets { margin-top: 10px; display: flex; gap: 5px; flex-wrap: wrap; min-height: 34px; }
        .cha-card .cc-bio { margin-top: 9px; font-size: 12px; color: #718096; line-height: 1.75; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
        .cha-card .cc-pets img { width: 34px; height: 34px; object-fit: contain; background: #f4f7f9; border: 1px solid #e2e8f0; border-radius: 9px; padding: 2px; }
        .cha-card .cc-pets .cc-none { font-size: 11px; color: #cbd5e0; font-weight: 700; align-self: center; }

        /* 详情 */
        .crumb-bar { max-width: 1200px; margin: 18px auto 0; padding: 0 20px; display: flex; justify-content: space-between; align-items: center; }
        .crumb-left a { display: inline-flex; align-items: center; gap: 6px; color: #718096; text-decoration: none; font-size: 13px; font-weight: 800; padding: 8px 16px; border-radius: 999px; background: #fff; border: 1px solid #e2e8f0; transition: color .15s, border-color .15s; }
        .crumb-left a:hover { color: #185FA5; border-color: #185FA5; }
        .card-share-btn { flex: none; display: inline-flex; align-items: center; gap: 7px; height: 36px; padding: 0 16px; border: 1px solid #bcd4ea; border-radius: 999px; background: #f5faff; color: #185FA5; font-size: 13px; font-weight: 900; font-family: inherit; cursor: pointer; transition: all .15s; }
        .card-share-btn:hover { background: #e8f3fd; border-color: #8fbde3; transform: translateY(-1px); }
        .detail-wrap { max-width: 1200px; margin: 16px auto 40px; padding: 0 20px; display: grid; grid-template-columns: 380px minmax(0, 1fr); gap: 20px; align-items: start; }

        .profile-card { background: #fff; border: 1px solid #e8edf2; border-radius: 22px; overflow: hidden; box-shadow: 0 12px 32px rgba(45,55,72,.12); }
        .pf-portrait { background: linear-gradient(180deg, #eef4fb, #f8fbff); border-bottom: 1px solid #e8edf2; }
        .pf-portrait img { display: block; width: 100%; max-height: 420px; object-fit: cover; object-position: center top; }
        .profile-top { background: linear-gradient(135deg, #14538f 0%, #378ADD 100%); color: #fff; padding: 30px 26px 24px; position: relative; overflow: hidden; }
        .profile-top::after { content: ''; position: absolute; right: -50px; top: -60px; width: 170px; height: 170px; border-radius: 50%; background: rgba(255,255,255,.12); }
        .profile-top .pf-id { font-size: 11px; font-weight: 800; letter-spacing: .2em; opacity: .75; }
        .profile-top h1 { margin-top: 8px; font-size: 30px; font-weight: 900; letter-spacing: .04em; }
        .profile-top .pf-title { margin-top: 8px; display: inline-flex; align-items: center; gap: 6px; font-size: 12.5px; font-weight: 800; background: rgba(255,255,255,.16); border: 1px solid rgba(255,255,255,.35); padding: 5px 14px; border-radius: 999px; }
        .profile-body { padding: 20px 24px 24px; }
        .profile-body .pf-money { display: flex; align-items: center; justify-content: space-between; background: #fffdf6; border: 1px solid #f2e6cf; border-radius: 14px; padding: 14px 18px; }
        .profile-body .pf-money .lbl { font-size: 11.5px; font-weight: 800; color: #a0aec0; letter-spacing: .08em; }
        .profile-body .pf-money .val { font-size: 21px; font-weight: 900; color: #a3720b; display: flex; align-items: center; gap: 8px; }
        .profile-body .pf-money .val i { color: #d4a017; font-size: 17px; }
        .profile-body .pf-money .unit { font-size: 12px; color: #c9a349; font-weight: 800; }
        .profile-body .pf-faction { margin-top: 14px; display: flex; align-items: center; gap: 10px; background: #E6F1FB; border: 1px solid #B5D4F4; border-radius: 14px; padding: 13px 18px; font-size: 14px; font-weight: 900; color: #14538f; }
        .profile-body .pf-faction i { color: #378ADD; }
        .profile-body .pf-faction small { font-size: 11px; color: #85b7eb; font-weight: 800; margin-left: auto; }

        .info-card { background: #fff; border: 1px solid #e8edf2; border-radius: 18px; padding: 20px 22px; margin-bottom: 16px; }
        .info-card h2 { font-size: 16px; font-weight: 900; color: #1a202c; margin-bottom: 14px; display: flex; align-items: center; gap: 8px; }
        .info-card h2 i { color: #185FA5; font-size: 14px; }
        .info-card h2 .total-badge { margin-left: auto; font-size: 12px; color: #14538f; background: #E6F1FB; padding: 3px 13px; border-radius: 999px; }
        .bio { font-size: 14px; line-height: 2.05; color: #4a5568; white-space: pre-line; }
        .pf-position { display: inline-flex; align-items: center; gap: 5px; font-size: 12px; font-weight: 900; color: #fff; background: #2b6cb0; padding: 4px 12px; border-radius: 999px; margin-top: 4px; }
        .pf-detail { display: grid; grid-template-columns: 52px 1fr; gap: 12px; padding: 10px 0; border-bottom: 1px dashed #e8edf2; }
        .pf-detail:last-child { border-bottom: 0; padding-bottom: 0; }
        .pd-lbl { font-size: 12.5px; font-weight: 900; color: #b7791f; }
        .pf-detail p { margin: 0; font-size: 13.5px; line-height: 1.95; color: #4a5568; white-space: pre-line; }
        /* 御兽师个人成就 */
        .ms-card { border-left: 3px solid #d4a017; padding-left: 13px; margin: 12px 0; }
        .ms-head { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
        .ms-contract { font-size: 13.5px; font-weight: 900; color: #9c6b0e; }
        .ms-chapter { font-size: 11px; font-weight: 900; color: #2b6cb0; background: #ebf8ff; border: 1px solid #bee3f8; padding: 2px 9px; border-radius: 999px; }
        .ms-list { margin-top: 10px; position: relative; }
        .ms-list::before { content: ''; position: absolute; left: 6px; top: 6px; bottom: 6px; width: 2px; background: #e2e8f0; }
        .ms-item { position: relative; padding: 0 0 12px 22px; }
        .ms-item::before { content: ''; position: absolute; left: 2px; top: 5px; width: 10px; height: 10px; border-radius: 50%; background: #d4a017; box-shadow: 0 0 0 3px #fff8e6; }
        .ms-title { font-size: 13.5px; font-weight: 900; color: #2d3748; }
        .ms-date { font-size: 11.5px; font-weight: 700; color: #a0aec0; margin-left: 8px; }
        .ms-note { font-size: 12px; color: #718096; line-height: 1.8; margin-top: 2px; }
        .ms-empty { font-size: 12.5px; color: #a0aec0; font-weight: 700; margin-top: 8px; }

        /* 关系视图切换 */
        .view-switch { display: flex; gap: 4px; background: #fff; border: 1px solid #e2e8f0; border-radius: 999px; padding: 4px; }
        .view-switch button { display: inline-flex; align-items: center; gap: 6px; height: 32px; padding: 0 16px; border: none; border-radius: 999px; background: transparent; font-family: inherit; font-size: 13px; font-weight: 900; color: #718096; cursor: pointer; transition: background .15s, color .15s; white-space: nowrap; }
        .view-switch button:hover { color: #185FA5; }
        .view-switch button.on { background: #185FA5; color: #fff; }

        /* 详情 · 人物关系 */
        .rel-head { display: flex; align-items: center; gap: 10px; padding: 10px 12px; border: 1px solid #e8edf2; border-radius: 12px; background: #fbfcfe; margin-bottom: 8px; cursor: pointer; transition: border-color .15s, background .15s, transform .15s; }
        .rel-head:last-child { margin-bottom: 0; }
        .rel-head:hover { border-color: #185FA5; background: #f5faff; transform: translateX(2px); }
        .rel-av { flex: none; width: 34px; height: 34px; border-radius: 50%; display: flex; align-items: center; justify-content: center; color: #fff; font-size: 14px; font-weight: 900; }
        .rel-main { flex: 1; min-width: 0; }
        .rel-main b { font-size: 13.5px; font-weight: 900; color: #2d3748; }
        .rel-main span { display: block; font-size: 11.5px; color: #a0aec0; font-weight: 700; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
        .rel-tag { flex: none; font-size: 11.5px; font-weight: 900; color: #9c6b0e; background: #fffdf5; border: 1px solid #f0e5cd; padding: 4px 11px; border-radius: 999px; }
        .rel-head > i { color: #cbd5e0; font-size: 11px; }

        /* 关系谱 */
        .graph-bar { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; background: #fffdf8; border: 1px solid #fcecd7; border-radius: 16px; padding: 12px 16px; margin-bottom: 16px; }
        .graph-bar .gb-lbl { font-size: 12px; font-weight: 900; color: #b7791f; letter-spacing: .04em; }
        .graph-bar select { padding: 9px 13px; border: 1px solid #e2e8f0; border-radius: 10px; background: #fff; font-family: inherit; font-size: 13.5px; font-weight: 800; color: #2d3748; outline: none; cursor: pointer; }
        .graph-bar .gb-hint { margin-left: auto; font-size: 11.5px; font-weight: 700; color: #a0aec0; }
        .graph-card { background: #fff; border: 1px solid #e8edf2; border-radius: 18px; padding: 8px 10px 4px; box-shadow: 0 10px 26px rgba(45,55,72,.07); }
        .graph-svg { width: 100%; height: auto; display: block; }
        .graph-svg .g-edge { stroke: #cbd9e8; stroke-width: 2; }
        .graph-svg .g-edge.strong { stroke: #7fb0e0; stroke-width: 2.6; }
        .graph-svg .g-label { fill: #718096; font-size: 11.5px; font-weight: 800; }
        .graph-svg .g-node { cursor: pointer; }
        .graph-svg .g-node:hover .g-circle { stroke: #185FA5; stroke-width: 4; }
        .graph-svg .g-circle { transition: stroke .15s; }
        .graph-svg .g-name { fill: #2d3748; font-size: 13px; font-weight: 900; }
        .graph-svg .g-init { fill: #fff; font-size: 17px; font-weight: 900; }
        .graph-foot { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; padding: 12px 10px 10px; }
        .graph-foot .gf-note { font-size: 11.5px; color: #a0aec0; font-weight: 700; }
        .graph-empty { text-align: center; padding: 50px 20px; color: #a0aec0; font-weight: 700; }
        @media (max-width: 640px) { .graph-bar .gb-hint { margin-left: 0; } .view-switch { width: 100%; justify-content: center; } }

        /* 物品栏 */
        .inv-row { display: flex; align-items: center; gap: 12px; padding: 11px 14px; border-radius: 12px; background: #fffdf6; border: 1px solid #f2e6cf; margin-bottom: 8px; }
        .inv-row:last-child { margin-bottom: 0; }
        .inv-ico { width: 36px; height: 36px; border-radius: 10px; background: #fdf2d9; display: flex; align-items: center; justify-content: center; color: #d4a017; font-size: 15px; flex-shrink: 0; }
        .inv-txt { flex: 1; min-width: 0; }
        .inv-txt b { font-size: 13.5px; color: #7a5a14; display: block; }
        .inv-txt span { font-size: 11.5px; color: #b0a37f; font-weight: 700; }
        .inv-empty { font-size: 12.5px; color: #a0aec0; font-weight: 700; }

        /* 持有精灵 */
        .pet-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 12px; }
        .pet-card { background: #f8fafc; border: 1px solid #eef2f6; border-radius: 14px; padding: 12px 12px 10px; text-align: center; cursor: pointer; transition: transform .15s, border-color .15s, box-shadow .15s; }
        .pet-card:hover { transform: translateY(-2px); border-color: #ff6b6b; box-shadow: 0 6px 14px rgba(45,55,72,.12); }
        .pet-card img { width: 72px; height: 72px; object-fit: contain; }
        .pet-card .p-name { font-size: 13.5px; font-weight: 900; color: #2d3748; margin-top: 4px; }
        .pet-card .p-stage { margin-top: 5px; display: inline-block; font-size: 10.5px; font-weight: 900; color: #fff; padding: 2px 10px; border-radius: 999px; }
        .pet-card .p-lv { font-size: 10.5px; color: #a0aec0; margin-top: 3px; }

        .empty-state { text-align: center; color: #a0aec0; padding: 60px 20px; font-weight: 700; background: #fff; border-radius: 18px; border: 1px solid #e8edf2; max-width: 720px; margin: 40px auto; }
        .empty-state i { font-size: 34px; display: block; margin-bottom: 14px; }

        .no-anim *, .no-anim *::before, .no-anim *::after { transition: none !important; animation: none !important; }

        @media (max-width: 900px) {
            .detail-wrap { grid-template-columns: 1fr; gap: 14px; padding: 0 12px; }
            .container { padding: 0 12px; }
        }
    </style>
    <link rel="stylesheet" href="css/navbar.css?v=20261125a">
    <script src="js/navbar.js?v=20261125c" defer></script>
    <link rel="stylesheet" href="css/responsive.css?v=20261124f">
</head>
<body>

<div id="app">
    <div id="site-navbar"></div>

    <template v-if="cha">
        <!-- 详情模式 -->
        <div class="crumb-bar">
            <div class="crumb-left">
                <a href="characters.html"><i class="fa-solid fa-arrow-left"></i> 御兽人物档案</a>
            </div>
            <button class="card-share-btn" @click="exportCard"><i class="fa-solid fa-id-card"></i> 生成卡片</button>
        </div>

        <div class="detail-wrap">
            <div>
                <div class="profile-card">
                    <div class="pf-portrait" v-if="cha.avatar">
                        <img :src="getImgUrl(cha.avatar)" :alt="cha.name">
                    </div>
                    <div class="profile-top">
                        <div class="pf-id font-num">CHARACTER · {{ cha.id }}</div>
                        <h1>{{ cha.name }}</h1>
                        <span class="pf-title" v-if="cha.title"><i class="fa-solid fa-medal"></i> {{ cha.title }}</span>
                        <span class="pf-position" v-if="cha.position"><i class="fa-solid fa-id-badge"></i> {{ cha.position }}</span>
                    </div>
                    <div class="profile-body">
                        <div class="pf-money">
                            <span class="lbl">存款 · SAVINGS</span>
                            <span class="val font-num"><i class="fa-solid fa-coins"></i>{{ fmtMoney(cha.money) }}<span class="unit">联盟币</span></span>
                        </div>
                <div class="pf-faction" v-if="cha.faction">
                    <i class="fa-solid fa-flag"></i> {{ cha.faction }}
                    <small>所属势力</small>
                </div>
                <div class="pf-faction" v-if="cha.birthplace">
                    <i class="fa-solid fa-location-dot"></i> {{ cha.birthplace }}
                    <small>出生地区</small>
                </div>
                    </div>
                </div>
            </div>

            <div>
                <div class="info-card" v-if="cha.bio">
                    <h2><i class="fa-solid fa-user-pen"></i> 人物简介</h2>
                    <p class="bio">{{ cha.bio }}</p>
                </div>

                <div class="info-card">
                    <h2><i class="fa-solid fa-paw"></i> 持有精灵 <span class="total-badge font-num">{{ chaPets.length }} 只</span></h2>
                    <div class="pet-grid" v-if="chaPets.length">
                        <div class="pet-card" v-for="p in chaPets" :key="p.id"
                             :title="'查看 ' + indName(p) + ' 的档案'"
                             @click="gotoIndividual(p.id)">
                            <img v-if="speciesImageOf(p)" :src="speciesImageOf(p)" :alt="indName(p)">
                            <i v-else class="fa-solid fa-paw" style="font-size: 40px; color: #cbd5e0; line-height: 72px;"></i>
                            <div class="p-name">{{ indName(p) }}</div>
                            <div class="p-stage" :style="{ background: stageColor(p) }">{{ stageName(p) }}</div>
                            <div class="p-lv font-num">Lv.{{ p.level }}</div>
                        </div>
                    </div>
                    <div class="inv-empty" v-else>暂未契约精灵，或档案尚未录入。</div>
                </div>

                <div class="info-card" v-if="linkRows.length">
                    <h2><i class="fa-solid fa-diagram-project"></i> 人物关系 <span class="total-badge font-num">{{ linkRows.length }} 条</span></h2>
                    <div class="rel-head" v-for="l in linkRows" :key="l.id" :title="'查看 ' + l.name + ' 的档案'" @click="gotoCharacterById(l.id)">
                        <span class="rel-av" :style="{ background: avatarColor(l.name) }">{{ l.name.charAt(0) }}</span>
                        <span class="rel-main">
                            <b>{{ l.name }}</b>
                            <span v-if="l.note || l.faction">{{ l.note || l.faction }}</span>
                        </span>
                        <span class="rel-tag">{{ l.rel || '关系' }}</span>
                        <i class="fa-solid fa-chevron-right"></i>
                    </div>
                </div>

                <div class="info-card" v-if="cha.background || cha.personality || cha.appearance || cha.relations || cha.strength">
                    <h2><i class="fa-solid fa-address-book"></i> 人物档案</h2>
                    <div class="pf-detail" v-if="cha.background"><span class="pd-lbl">背景</span><p>{{ cha.background }}</p></div>
                    <div class="pf-detail" v-if="cha.personality"><span class="pd-lbl">性格</span><p>{{ cha.personality }}</p></div>
                    <div class="pf-detail" v-if="cha.appearance"><span class="pd-lbl">外貌</span><p>{{ cha.appearance }}</p></div>
                    <div class="pf-detail" v-if="cha.relations"><span class="pd-lbl">概述</span><p>{{ cha.relations }}</p></div>
                    <div class="pf-detail" v-if="cha.strength"><span class="pd-lbl">实力</span><p>{{ cha.strength }}</p></div>
                </div>

                <div class="info-card" v-if="cha.milestones && cha.milestones.length">
                    <h2><i class="fa-solid fa-medal"></i> 御兽师个人成就</h2>
                    <div class="ms-list">
                        <div class="ms-item" v-for="(m, i) in cha.milestones" :key="i">
                            <span class="ms-chapter" v-if="m.chapter">{{ m.chapter }}</span>
                            <span class="ms-title">{{ m.title }}</span>
                            <span class="ms-date" v-if="m.date">{{ m.date }}</span>
                            <div class="ms-note" v-if="m.note">{{ m.note }}</div>
                        </div>
                    </div>
                </div>

                <div class="info-card">
                    <h2><i class="fa-solid fa-suitcase"></i> 物品栏 <span class="total-badge font-num" v-if="inventory.length">{{ inventory.length }} 件</span></h2>
                    <div v-if="inventory.length">
                        <div class="inv-row" v-for="it in inventory" :key="it.name">
                            <span class="inv-ico"><i class="fa-solid fa-box-open"></i></span>
                            <span class="inv-txt"><b>{{ it.name }}</b><span v-if="it.note">{{ it.note }}</span></span>
                        </div>
                    </div>
                    <div class="inv-empty" v-else>物品栏是空的。</div>
                </div>
            </div>
        </div>
    </template>

    <!-- 列表模式 -->
    <template v-else-if="loaded">
        <div class="container">
            <div class="header">
                <div>
                    <h2>御兽人物档案 <span class="count font-num">{{ filteredCharacters.length }} 位人物</span></h2>
                </div>
            </div>

            <div class="filter-bar">
                <div class="search-box" v-if="viewMode === 'list'">
                    <i class="fa-solid fa-magnifying-glass"></i>
                    <input type="text" v-model="searchName" placeholder="搜索姓名、势力、简介关键词...">
                </div>
                <div class="graph-bar" style="flex: 1; margin: 0; padding: 0; border: 0; background: transparent;" v-else>
                    <span class="gb-lbl">关系谱中心</span>
                    <select v-model="graphCenterId">
                        <option v-for="c in characters" :key="c.id" :value="c.id">{{ c.name }}</option>
                    </select>
                    <span class="gb-hint">点图上的节点可切换中心</span>
                </div>
                <select class="filter-select" v-if="viewMode === 'list'" v-model="filterFaction">
                    <option value="">全部势力</option>
                    <option v-for="f in factions" :key="f" :value="f">{{ f }}</option>
                </select>
                <div class="view-switch">
                    <button :class="{ on: viewMode === 'list' }" @click="viewMode = 'list'"><i class="fa-solid fa-id-card"></i> 人物档案</button>
                    <button :class="{ on: viewMode === 'graph' }" @click="viewMode = 'graph'"><i class="fa-solid fa-diagram-project"></i> 关系谱</button>
                </div>
            </div>

            <div class="graph-card" v-if="viewMode === 'graph'">
                <template v-if="graph.edges.length">
                    <svg class="graph-svg" :viewBox="'0 0 ' + graph.w + ' ' + graph.h" role="img" :aria-label="'以 ' + (graphCenter ? graphCenter.name : '') + ' 为中心的人物关系谱'">
                        <line v-for="(e, i) in graph.edges" :key="'e' + i" class="g-edge" :class="{ strong: e.strong }"
                              :x1="e.x1" :y1="e.y1" :x2="e.x2" :y2="e.y2"></line>
                        <g v-for="(e, i) in graph.edges" :key="'el' + i">
                            <rect :x="e.lx - e.lw / 2" :y="e.ly - 11" :width="e.lw" height="22" rx="11" fill="#ffffff" stroke="#e8edf2"></rect>
                            <text class="g-label" :x="e.lx" :y="e.ly + 4" text-anchor="middle">{{ e.label }}</text>
                        </g>
                        <g class="g-node" v-for="n in graph.nodes" :key="n.id" @click="setGraphCenter(n.id)">
                            <circle class="g-circle" :cx="n.x" :cy="n.y" :r="n.r" :fill="n.color" stroke="#ffffff" stroke-width="3"></circle>
                            <text class="g-init" :x="n.x" :y="n.y + 6" text-anchor="middle">{{ n.init }}</text>
                            <text class="g-name" :x="n.x" :y="n.y + n.r + 20" text-anchor="middle">{{ n.label }}</text>
                        </g>
                    </svg>
                    <div class="graph-foot">
                        <button class="btn btn-outline" v-if="graphCenter" @click="gotoCharacter(graphCenter)">
                            <i class="fa-solid fa-user-pen"></i> 打开「{{ graphCenter.name }}」的档案
                        </button>
                        <span class="gf-note" v-if="graph.hidden">还有 {{ graph.hidden }} 位关系人物未画出（关系过多时只显示前 14 位）</span>
                        <span class="gf-note" v-else>记录 {{ graph.nodes.length - 1 }} 条直接关系</span>
                    </div>
                </template>
                <div class="graph-empty" v-else>
                    <i class="fa-solid fa-diagram-project" style="font-size: 30px; display: block; margin-bottom: 12px;"></i>
                    这位人物还没有录入关系<br>
                    <small style="font-weight: 600;">后台「御兽人物 → 编辑 → 人物关系」可以为角色点选彼此关系</small>
                </div>
            </div>

            <div class="cha-grid" v-if="viewMode === 'list' && filteredCharacters.length">
                <div class="cha-card" v-for="c in filteredCharacters" :key="c.id"
                     :title="'点击查看 ' + c.name + ' 的详细档案'"
                     @click="gotoCharacter(c)">
                    <div class="cc-top">
                        <div class="cc-name">{{ c.name }}</div>
                        <div class="cc-title" v-if="c.title"><i class="fa-solid fa-medal" style="margin-right:4px;"></i>{{ c.title }}</div>
                    </div>
                    <div class="cc-body">
                        <div class="cc-faction" v-if="c.faction"><i class="fa-solid fa-flag"></i> {{ c.faction }}</div>
                        <div class="cc-money font-num"><i class="fa-solid fa-coins"></i> {{ fmtMoney(c.money) }} 联盟币</div>
                        <div class="cc-bio" v-if="c.bio">{{ c.bio }}</div>
                        <div class="cc-pets">
                            <template v-for="p in petsPreview(c)" :key="p.id">
                                <img v-if="speciesImageOf(p)" :src="speciesImageOf(p)" :alt="indName(p)" :title="indName(p)">
                            </template>
                            <span class="cc-none" v-if="!petsPreview(c).length">暂无契约精灵</span>
                        </div>
                    </div>
                </div>
            </div>
            <div class="empty-state" v-if="viewMode === 'list' && !filteredCharacters.length">
                <i class="fa-solid fa-users"></i>
                暂无符合条件的御兽人物档案<br>
                <small style="font-weight:600;">可在管理者后台「御兽人物」中录入书中角色</small>
            </div>
        </div>
    </template>

    <div class="container" v-else>
        <div class="empty-state"><i class="fa-solid fa-users"></i>正在加载档案数据…</div>
    </div>
</div>

<script src="js/type-config.js?v=20261124"></script>
<script src="js/site-config.js?v=20261124"></script>
<script src="js/data-loader.js?v=20261126c"></script>
<script src="js/card-export.js?v=20261126p"></script>
<script>
    const { createApp, ref, computed, onMounted } = Vue;
VowmonData.ready(['characters', 'individuals', 'pets']).then(function () {

    /* 精灵等级八阶（与 individuals.html 保持一致） */
    const RANK_BANDS = [
        { name: '初灵', min: 1,   max: 15 },
        { name: '升灵', min: 16,  max: 36 },
        { name: '族尊', min: 37,  max: 50 },
        { name: '基座', min: 51,  max: 60 },
        { name: '灵相', min: 61,  max: 70 },
        { name: '律冠', min: 71,  max: 89 },
        { name: '元灵', min: 90,  max: 99 },
        { name: '元',   min: 100, max: 9999 }
    ];
    const STAGE_COLORS = {
        '初灵': '#8bc34a', '升灵': '#26a69a', '族尊': '#5c6bc0', '基座': '#ba7517',
        '灵相': '#1971c2', '律冠': '#7048e8', '元灵': '#d4a017', '元': '#e24b4a'
    };

    createApp({
        setup() {
            const params = new URLSearchParams(window.location.search);
            const urlId = (params.get('id') || '').trim();
            const notFound = ref(false);
            const loaded = ref(false);

            const characters = ref([]);
            const individuals = ref([]);
            const pets = ref([]);
            VowmonData.onChange('characters', (data) => {
                characters.value = (data && data.characters) || allCharactersData || [];
            });

            const normalize = (c) => {
                const p = Object.assign({}, c || {});
                p.name = String(p.name == null ? '' : p.name);
                p.money = Number(p.money) || 0;
                p.inventory = Array.isArray(p.inventory)
                    ? p.inventory.map(it => (typeof it === 'string' ? { name: it, note: '' } : it)).filter(it => it && it.name)
                    : [];
                p.petIds = Array.isArray(p.petIds) ? p.petIds.map(String) : [];
                p.links = Array.isArray(p.links)
                    ? p.links.map(l => ({
                        id: String((l && (l.id || l.targetId)) || '').trim(),
                        rel: String((l && l.rel) || '').trim(),
                        note: String((l && l.note) || '').trim()
                    })).filter(l => l.id)
                    : [];
                p.position = String(p.position == null ? '' : p.position);
                p.birthplace = String(p.birthplace == null ? '' : p.birthplace);
                ['background', 'personality', 'relations', 'appearance', 'strength', 'avatar'].forEach(k => { p[k] = String(p[k] == null ? '' : p[k]); });
                p.milestones = Array.isArray(p.milestones) ? p.milestones : [];
                return p;
            };
            characters.value = (allCharactersData || []).map(normalize);
            individuals.value = (allIndividualsData || []).map(v => Object.assign({}, v));
            pets.value = allPetsData || [];

            const cha = computed(() => characters.value.find(c => c.id === urlId) || null);

            let siteConfig = {};
            try { siteConfig = JSON.parse(localStorage.getItem('vowmon_sync_config') || '{}') || {}; } catch (e) { siteConfig = {}; }
            const IMG_RAW = String(siteConfig.imgCdnBase || (window.VOWMON_SITE_CONFIG || {}).imgCdnBase || '').trim().replace(/\/+$/, '');
            const IMG_BASE = IMG_RAW ? IMG_RAW + '/' : '';
            const getImgUrl = (path) => {
                if (!path) return '';
                if (/^(https?:)?\/\//i.test(path) || path.startsWith('data:')) return path;
                return IMG_BASE + String(path).replace(/^\/+/, '');
            };

            const speciesOf = (p) => pets.value.find(s => String(s.id) === String(p.speciesId)) || null;
            const speciesImageOf = (p) => { const s = speciesOf(p); return s && s.image ? getImgUrl(s.image) : ''; };
            /* 昵称选填：没起昵称就直接叫种族名 */
            const indName = (p) => {
                const nick = p && p.nickname && String(p.nickname).trim();
                if (nick) return nick;
                const s = speciesOf(p);
                return s ? s.name : '未命名精灵';
            };

            const stageName = (p) => {
                const lv = Number(p.level) || 0;
                if (lv <= 0) return '未记录';
                const band = RANK_BANDS.find(b => lv >= b.min && lv <= b.max);
                return band ? band.name : '未记录';
            };
            const stageColor = (p) => STAGE_COLORS[stageName(p)] || '#718096';

            /* ---------------- 关联 ---------------- */
            const indById = computed(() => {
                const m = new Map();
                individuals.value.forEach(p => m.set(String(p.id), p));
                return m;
            });
            const chaPets = computed(() => {
                if (!cha.value) return [];
                return cha.value.petIds.map(id => indById.value.get(String(id))).filter(Boolean);
            });
            const inventory = computed(() => (cha.value && cha.value.inventory) || []);
            const petsPreview = (c) => (c.petIds || []).slice(0, 4).map(id => indById.value.get(String(id))).filter(Boolean);

            const fmtMoney = (n) => Number(n || 0).toLocaleString('zh-CN');

            /* ---------------- 人物关系 / 关系谱 ---------------- */
            const AVATAR_PALETTE = ['#d69e2e', '#2b6cb0', '#38a169', '#7F77DD', '#d4537e', '#0F6E56', '#e24b4a', '#5c6bc0'];
            const avatarColor = (name) => {
                let h = 0;
                const str = String(name || '');
                for (let i = 0; i < str.length; i++) h = (h * 31 + str.charCodeAt(i)) >>> 0;
                return AVATAR_PALETTE[h % AVATAR_PALETTE.length];
            };
            const charById = (id) => characters.value.find(c => String(c.id) === String(id)) || null;
            const linksOf = (c) => (c && Array.isArray(c.links) ? c.links : []);
            const trunc = (s, n) => {
                const str = String(s || '');
                return str.length > n ? str.slice(0, n) + '…' : str;
            };

            const gotoCharacterById = (id) => { if (id) window.location.href = 'characters.html?id=' + encodeURIComponent(id); };

            const linkRows = computed(() => {
                if (!cha.value) return [];
                return linksOf(cha.value).map(l => {
                    const c = charById(l.id);
                    return {
                        id: l.id,
                        name: c ? c.name : '（已删除的人物）',
                        faction: c ? c.faction : '',
                        rel: l.rel,
                        note: l.note
                    };
                });
            });

            const viewMode = ref('list');
            const graphCenterId = ref(urlId || '');
            const graphCenter = computed(() =>
                characters.value.find(c => String(c.id) === String(graphCenterId.value)) || characters.value[0] || null
            );
            const setGraphCenter = (id) => { graphCenterId.value = String(id); };

            /* 环形关系谱：中心人物 + 一层直接关系（双向合并去重） */
            const graph = computed(() => {
                const center = graphCenter.value;
                const W = 900;
                if (!center) return { w: W, h: 420, nodes: [], edges: [], hidden: 0 };

                const seen = new Set([String(center.id)]);
                const partners = [];
                linksOf(center).forEach(l => {
                    const c = charById(l.id);
                    if (!c || seen.has(String(c.id))) return;
                    seen.add(String(c.id));
                    partners.push({ c, rel: l.rel });
                });
                characters.value.forEach(c => {
                    if (seen.has(String(c.id))) return;
                    const back = linksOf(c).find(l => String(l.id) === String(center.id));
                    if (!back) return;
                    seen.add(String(c.id));
                    partners.push({ c, rel: back.rel });
                });

                const MAX = 14;
                const hidden = Math.max(0, partners.length - MAX);
                const list = partners.slice(0, MAX);
                const n = list.length;
                const H = n <= 6 ? 520 : 620;
                const cx = W / 2;
                const cy = H / 2;
                const rx = n <= 4 ? 250 : 318;
                const ry = n <= 4 ? 148 : (n <= 8 ? 186 : 228);

                const nodes = [{
                    id: String(center.id), x: cx, y: cy, r: 44,
                    color: '#14538f', init: String(center.name || '？').charAt(0),
                    label: trunc(center.name, 8)
                }];
                const edges = [];
                list.forEach((p, i) => {
                    const a = (i * Math.PI * 2 / Math.max(n, 1)) - Math.PI / 2;
                    const x = cx + Math.cos(a) * rx;
                    const y = cy + Math.sin(a) * ry;
                    nodes.push({
                        id: String(p.c.id), x, y, r: 32,
                        color: avatarColor(p.c.name), init: String(p.c.name || '？').charAt(0),
                        label: trunc(p.c.name, 8)
                    });
                    const dx = x - cx;
                    const dy = y - cy;
                    const dist = Math.sqrt(dx * dx + dy * dy) || 1;
                    const ux = dx / dist;
                    const uy = dy / dist;
                    const x1 = cx + ux * 46;
                    const y1 = cy + uy * 46;
                    const x2 = x - ux * 34;
                    const y2 = y - uy * 34;
                    const label = p.rel || '关系';
                    edges.push({
                        x1, y1, x2, y2,
                        strong: !!p.rel,
                        label,
                        lx: (x1 + x2) / 2,
                        ly: (y1 + y2) / 2,
                        lw: Math.max(48, label.length * 13 + 18)
                    });
                });
                return { w: W, h: H, nodes, edges, hidden };
            });
            const gotoIndividual = (id) => { if (id) window.location.href = 'individuals.html?id=' + encodeURIComponent(id); };
            const gotoCharacter = (c) => { if (c && c.id) window.location.href = 'characters.html?id=' + encodeURIComponent(c.id); };

            /* ---------------- 筛选 ---------------- */
            const searchName = ref('');
            const filterFaction = ref('');
            const factions = computed(() => {
                const set = new Set();
                characters.value.forEach(c => { if (c.faction) set.add(c.faction); });
                return Array.from(set);
            });
            const filteredCharacters = computed(() => {
                const kw = searchName.value.trim().toLowerCase();
                return characters.value.filter(c => {
                    if (filterFaction.value && c.faction !== filterFaction.value) return false;
                    if (!kw) return true;
                    const hay = [c.name, c.faction, c.title, c.bio].join(' ').toLowerCase();
                    return hay.includes(kw);
                });
            });

            /* 导出训练家卡（TCG 卡牌风格：立绘/精灵大图 + 身份 + 简介） */
            const exportCard = () => {
                const c = cha.value;
                if (!c || !window.VowmonCard) return;
                const petNames = chaPets.value.slice(0, 6).map(p => indName(p)).join(' · ');
                const ability = {
                    tag: '身份',
                    name: c.title || c.faction || '御兽训练家',
                    text: (c.faction ? '所属势力：' + c.faction + '　' : '') + (petNames ? '持有精灵：' + petNames : '')
                };
                window.VowmonCard.open({
                    label: '训练家',
                    name: c.name,
                    badgeLabel: 'SAVINGS',
                    badgeValue: fmtMoney(c.money),
                    types: [
                        c.faction ? { name: c.faction, color: avatarColor(c.faction), icon: 'fa-solid fa-shield-halved' } : null,
                        c.birthplace ? { name: c.birthplace, color: '#8fa8bf', icon: 'fa-solid fa-location-dot' } : null
                    ].filter(Boolean),
                    image: (c.avatar ? getImgUrl(c.avatar) : '') || (chaPets.value[0] ? speciesImageOf(chaPets.value[0]) : ''),
                    ability: (ability.name || ability.text) ? ability : null,
                    sections: ['ability', 'desc'],
                    secLabels: { ability: '身份条', desc: '人物简介' },
                    desc: c.bio || '',
                    descLabel: '人物简介',
                    accent: c.faction ? avatarColor(c.faction) : '#185FA5',
                    variant: 'trainer',
                    dexNo: c.id ? 'ID ' + c.id : '',
                    footLeft: '',
                    footRight: 'VOWMON WIKI'
                });
            };

            onMounted(() => {
                loaded.value = true;
                if (!graphCenterId.value && characters.value.length) graphCenterId.value = characters.value[0].id;
                setTimeout(() => { if (urlId && !cha.value) notFound.value = true; }, 0);
            });

            return {
                cha, notFound, loaded,
                characters, filteredCharacters, factions,
                searchName, filterFaction,
                chaPets, inventory, petsPreview,
                speciesImageOf, stageName, stageColor, indName,
                fmtMoney, gotoIndividual, gotoCharacter, getImgUrl,
                /* 关系 / 关系谱 */
                linkRows, avatarColor, gotoCharacterById,
                viewMode, graphCenterId, graphCenter, graph, setGraphCenter,
                exportCard
            };
        }
    }).mount('#app');
});
</script>
</body>
</html>
