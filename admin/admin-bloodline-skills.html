<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <link rel="icon" type="image/x-icon" href="../favicon.ico">
    <title>Vowmon Wiki - 血脉技能管理</title>
    <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
    <script src="https://cdn.jsdelivr.net/npm/vue@3.5.13/dist/vue.global.prod.js"></script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fortawesome/fontawesome-free@6.4.0/css/all.min.css">
    <link rel="stylesheet" href="../css/admin.css?v=20261126s">
    <link rel="stylesheet" href="../css/common-ui.css?v=20261126s">
    <link rel="stylesheet" href="../css/dialog.css?v=20261126s">
    <link rel="stylesheet" href="../css/responsive.css?v=20261126s">
    <style>
        .toolbar { max-width: 1100px; margin: 0 auto 14px; justify-content: center; }
        .toolbar .search-box { flex: 0 0 280px; }
        .toolbar .count-pill { font-size: 14px; }
        .bs-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(210px, 1fr)); gap: 12px; max-width: 1100px; margin: 0 auto; }
        .bs-card { position: relative; background: #fff; border: 1px solid #e5ecf3; border-radius: 12px; padding: 12px 14px; box-shadow: 0 1px 2px rgba(45,55,72,.04); transition: transform .14s, box-shadow .14s; }
        .bs-card:hover { transform: translateY(-2px); box-shadow: 0 6px 16px rgba(45,55,72,.1); }
        .bs-head { display: flex; align-items: center; gap: 8px; }
        .bs-head b { font-size: 15.5px; color: #2d3748; }
        .bs-card .bs-note { font-size: 13px; margin-top: 7px; min-height: 18px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
        .bs-ops { margin-top: 8px; display: flex; gap: 6px; justify-content: flex-end; }
        .bs-tag { font-size: 13px; display: inline-flex; align-items: center; gap: 5px; font-size: 12px; font-weight: 900; color: #fff; padding: 4px 12px; border-radius: 999px; }
        .bs-note { color: #a0aec0; font-size: 12.5px; }
        .bs-tip { margin: 10px auto 16px; max-width: 1000px; padding: 12px 16px; border: 1px solid #bee3f8; background: #ebf8ff; color: #2b6cb0; border-radius: 12px; font-size: 14px; font-weight: 700; line-height: 1.8; }
        .fam-card { background: #fff; border: 1px solid #e5ecf3; border-radius: 14px; padding: 16px 18px; margin: 0 auto 16px; max-width: 1000px; }
        .fam-head { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); align-items: end; gap: 12px; margin-bottom: 14px; }
        .fam-head .fam-cell { min-width: 0; }
        .fam-head input { width: 100%; padding: 9px 11px; border: 1px solid #dbe4ec; border-radius: 9px; font-size: 14px; outline: none; font-family: inherit; }
        .fam-grid { display: grid; grid-template-columns: repeat(6, 1fr); gap: 8px; }
        .fam-type { margin-bottom: 6px; }
        .fam-cell { text-align: center; }
        .fam-cell label { display: block; font-size: 12.5px; font-weight: 900; color: #4a5568; margin-bottom: 5px; text-align: center; }
        .fam-cell input { width: 100%; padding: 9px 8px; border: 1px solid #dbe4ec; border-radius: 8px; font-size: 13.5px; outline: none; font-family: inherit; text-align: center; background: #fbfdff; }
        .fam-actions { font-size: 13px; margin-top: 12px; display: flex; justify-content: center; }
        .vow-pick-list { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; max-height: 46vh; overflow-y: auto; }
        .vow-pick { position: relative; display: flex; flex-direction: column; align-items: flex-start; gap: 2px; padding: 10px 12px; border: 1px solid #dbe4ec; border-radius: 10px; background: #fff; cursor: pointer; font-family: inherit; }
        .vow-pick b { font-size: 13.5px; color: #2d3748; }
        .vow-pick small { font-size: 11px; color: #a0aec0; }
        .vow-pick.on { border-color: #4299e1; background: #ebf8ff; }
        .vow-pick i { position: absolute; top: 9px; right: 10px; color: #4299e1; }
    </style>
</head>
<body>
<div id="app" v-cloak>
    <header class="topbar">
        <h1><i class="fa-solid fa-dna"></i> 血脉技能管理</h1>
        <div class="topbar-actions">
            <button class="btn btn-outline" onclick="window.location.href='index.html'"><i class="fa-solid fa-arrow-left"></i> 返回精灵后台</button>
            <button class="btn btn-success" @click="syncToGitHub" :disabled="isSyncing"><i class="fa-brands fa-github"></i> {{ isSyncing ? '正在同步...' : '一键同步血脉技能' }}</button>
            <button class="btn btn-outline" @click="pullFromRepo" :disabled="isSyncing"><i class="fa-solid fa-cloud-arrow-down"></i> 从仓库拉取</button>
        </div>
    </header>

    <div class="layout">
        <aside class="sidebar">
            <div class="side-nav"></div>
        </aside>

        <main class="main-content">
            <div class="bs-tip"><i class="fa-solid fa-circle-info"></i> 每个科由一位族尊下发十八系血脉技能。选择或新建科 → 指定族尊（来自御兽精灵档案）→ 填好十八属性技能并保存；同科精灵自动适用。</div>
            <div class="fam-card">
                <div class="fam-head">
                    <div class="fam-cell"><label>选择 / 新建科 <i class="tip" data-tip="点击下拉选已有科；直接输入新名字即新建科">?</i></label><vow-select creatable :model-value="activeFamily" :options="familyOptions" @update:model-value="loadFamily" placeholder="选择或输入科名"></vow-select></div>
                    <div class="fam-cell"><label>族尊 <i class="tip" data-tip="优先列出御兽精灵里勾了【权】的掌权者，也可直接输入名字">?</i></label><vow-select creatable v-model="familyForm.zun" :options="zunOptions" placeholder="选择或输入族尊"></vow-select></div>
                    <div class="fam-cell"><label>&nbsp;</label><button class="btn btn-primary btn-sm" @click="saveFamily"><i class="fa-solid fa-check"></i> 保存该科技能包</button></div>
                    <div class="fam-cell" v-if="activeFamily"><label>&nbsp;</label><button class="btn btn-outline btn-sm" @click="deleteFamily">删除该科</button></div>
                </div>
                <div class="fam-grid">
                    <div class="fam-cell" v-for="t in typeOptions" :key="t"><span class="bs-tag fam-type" :style="{ background: typeColor(t) }"><i :class="typeIcon(t)"></i>{{ t }}</span><input v-model="familyForm.skills[t]" placeholder=""></div>
                </div>
                <div class="fam-actions"><span style="font-size:12px; color:#a0aec0; font-weight:700;">同一科共用同一位族尊下发的十八系血脉技能；属该科的精灵批量适用。</span></div>
            </div>

        </main>
    </div>

</div>

<script src="../js/site-config.js?v=20261126s"></script>
<script src="../js/type-config.js?v=20261126s"></script>
<script src="../js/data-loader.js?v=20261127a"></script>
<script src="../js/github-api.js?v=20261127b"></script>
<script src="../js/common-ui.js?v=20261126s"></script>
<script src="../js/vow-tip.js?v=20261126s"></script>
<script src="../js/dialog.js?v=20261126s"></script>
<script src="../js/vow-select.js?v=20261126s"></script>
<script src="../js/vow-textarea.js?v=20261126s"></script>
<script src="../js/admin-bloodline-skills.js?v=20261126s"></script>
<script src="sidebar.js?v=20261126z"></script>
</body>
</html>
