<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <link rel="icon" type="image/x-icon" href="../favicon.ico">
    <title>操作审计 · Vowmon 后台</title>
    <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fontsource-variable/inter@5/index.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fortawesome/fontawesome-free@6.4.0/css/all.min.css">
    <link rel="stylesheet" href="../css/admin.css?v=20261128b">
    <link rel="stylesheet" href="../css/common-ui.css?v=20261126s">
    <link rel="stylesheet" href="../css/dialog.css?v=20261126s">
    <link rel="stylesheet" href="../css/responsive.css?v=20261126u">
    <style>
        :root{--accent:#5f3dc4;--ink:#243044;--ink-2:#4a5872;--ink-3:#8593ad;--line:#e4e9f2}
        *{box-sizing:border-box;margin:0;padding:0}
        body{font-family:'Inter Variable','Inter',-apple-system,BlinkMacSystemFont,'Segoe UI','HarmonyOS Sans SC','MiSans','Source Han Sans SC','Noto Sans SC','PingFang SC','Microsoft YaHei',system-ui,sans-serif;background:#f6f8fc;color:var(--ink-2);min-height:100vh}
        .wrap{max-width:1000px;margin:0 auto;padding:24px 20px 70px}
        .bar{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:18px}
        .bar h1{font-size:22px;color:var(--ink);display:flex;align-items:center;gap:9px;margin-right:auto}
        .bar h1 i{color:var(--accent)}
        .btn{padding:8px 14px;border:1px solid var(--line);border-radius:9px;background:#fff;color:var(--ink-2);font-size:12px;font-weight:700;cursor:pointer;font-family:inherit}
        .btn:hover{border-color:var(--accent);color:var(--accent)}
        .btn.danger{color:#c92a2a}
        .card{background:#fff;border:1px solid var(--line);border-radius:16px;padding:20px;box-shadow:0 2px 10px rgba(36,48,68,.03)}
        table{width:100%;border-collapse:collapse;font-size:13px}
        th,td{padding:11px 12px;border-bottom:1px solid var(--line);text-align:left}
        th{color:var(--ink-3);font-size:11px;background:#fbfcfe}
        .act{font-weight:800;color:var(--accent)}
        .time{color:var(--ink-3);font-size:11px;white-space:nowrap}
        .empty{padding:36px;text-align:center;color:var(--ink-3);font-size:14px}
        .back{display:inline-block;margin-bottom:16px;color:var(--accent);font-size:13px;text-decoration:none;font-weight:700}
        @media(max-width:640px){.wrap{padding:16px 12px 60px}.bar h1{font-size:18px}table{font-size:11px}th,td{padding:8px 6px}}
    </style>
</head>
<body>
<div class="wrap">
    <a href="index.html" class="back"><i class="fa-solid fa-arrow-left"></i> 返回后台</a>
    <div id="app" v-cloak>
        <div class="bar">
            <h1><i class="fa-solid fa-clock-rotate-left"></i> 操作审计日志</h1>
            <button class="btn" @click="exportAll">导出 JSON</button>
            <button class="btn danger" @click="clearAll">清空</button>
        </div>
        <div class="sub" style="font-size:12px;color:#8593ad;margin-bottom:14px">记录本机后台的保存 / 同步 / 拉取操作（最多 200 条）。带快照的记录可一键恢复当时的本机镜像与脏标记。</div>
        <div class="card">
            <table v-if="logs.length">
                <tr><th>时间</th><th>操作</th><th>详情</th><th>页面</th><th>恢复</th></tr>
                <tr v-for="(e,i) in logs" :key="i">
                    <td class="time">{{ fmt(e.time) }}</td>
                    <td class="act">{{ e.action }}</td>
                    <td>{{ e.detail }}</td>
                    <td class="time">{{ e.page }}</td>
                    <td><button class="btn" v-if="e.snapshot" @click="restore(i)">恢复快照</button><span v-else style="color:#adb5bd">—</span></td>
                </tr>
            </table>
            <div class="empty" v-else>暂无操作记录。在任意后台页保存或同步数据后，这里会自动记录。</div>
        </div>
    </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/vue@3/dist/vue.global.prod.js"></script>
<script src="../js/audit-log.js?v=20261128"></script>
<script src="../js/dialog.js?v=20261126s"></script>
<script>
const { createApp, ref, onMounted } = Vue;
createApp({
    setup() {
        const logs = ref([]);
        const load = () => { logs.value = AuditLog.list(); };
        const fmt = t => { try { const d = new Date(t); return d.toLocaleString('zh-CN', { hour12: false }); } catch (e) { return t; } };
        const restore = async i => {
            const ok = await VowmonDialog.confirm('将把本机镜像与脏标记恢复到该条记录时的状态，之后的改动会丢失。继续？', { type:'warning', title:'恢复快照', okText:'恢复' });
            if (!ok) return;
            if (AuditLog.restore(i)) { VowmonDialog.toast('已恢复快照，请刷新后台页面', 'success'); load(); }
        };
        const clearAll = async () => {
            const ok = await VowmonDialog.confirm('确定清空所有审计记录？', { type:'warning', title:'清空日志' });
            if (!ok) return;
            AuditLog.clear(); load(); VowmonDialog.toast('已清空', 'success');
        };
        const exportAll = () => {
            const blob = new Blob([AuditLog.exportText()], { type:'application/json' });
            const a = document.createElement('a');
            a.href = URL.createObjectURL(blob); a.download = 'vowmon-audit-' + Date.now() + '.json'; a.click();
            URL.revokeObjectURL(a.href);
        };
        onMounted(load);
        return { logs, fmt, restore, clearAll, exportAll };
    }
}).mount('#app');
</script>
</body>
</html>
