<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <link rel="icon" type="image/x-icon" href="../favicon.ico">
    <title>每日精灵灵感 · Vowmon Wiki</title>
    <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fontsource-variable/inter@5/index.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fortawesome/fontawesome-free@6.4.0/css/all.min.css">
    <link rel="stylesheet" href="../css/navbar.css?v=20261128c">
    <script src="../js/navbar.js?v=20261128d" defer></script>
    <style>
        :root{--accent:#e8a013;--accent-2:#f6c453;--ink:#3d3222;--ink-2:#5c5142;--ink-3:#98917f;--line:#eee5d2;--card:#fffdf7}
        *{box-sizing:border-box;margin:0;padding:0}
        body{font-family:'Inter Variable','Inter',-apple-system,BlinkMacSystemFont,'Segoe UI','HarmonyOS Sans SC','MiSans','Source Han Sans SC','Noto Sans SC','PingFang SC','Microsoft YaHei',system-ui,sans-serif;background:#faf6ec;color:var(--ink-2);min-height:100vh;overflow-x:hidden}
        [v-cloak]{display:none}
        .page{max-width:860px;margin:0 auto;padding:30px 20px 80px}
        .hero{background:linear-gradient(135deg,#fdf3d8,#fffdf7 70%);border:1px solid #f2e3b8;border-radius:20px;padding:30px 34px;margin-bottom:22px}
        .hero h1{font-size:27px;color:var(--ink);display:flex;align-items:center;gap:10px;margin-bottom:8px}
        .hero h1 i{color:var(--accent)}
        .hero p{font-size:14px;line-height:1.9}
        .sec{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:24px 28px;margin-bottom:20px;box-shadow:0 2px 12px rgba(61,50,34,.04)}
        .sec h2{font-size:18px;color:var(--ink);margin-bottom:14px;display:flex;align-items:center;gap:9px}
        .sec h2 i{color:var(--accent)}
        .toolbar{display:flex;flex-wrap:wrap;align-items:center;gap:10px;margin-bottom:14px}
        .btn{padding:9px 16px;border:1px solid var(--line);border-radius:10px;background:#fff;color:var(--ink);font-size:13px;font-weight:700;cursor:pointer;font-family:inherit;transition:.15s}
        .btn:hover{border-color:var(--accent);color:var(--accent)}
        .btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
        .btn.primary:hover{background:#d18d0a;color:#fff}
        .btn:disabled{opacity:.5;cursor:wait}
        /* 数据源开关（分段按钮） */
        .src-seg{display:flex;flex-wrap:wrap;gap:8px;width:100%;margin-bottom:6px}
        .seg-opt{display:inline-flex;align-items:center;gap:7px;padding:7px 14px;border:1.5px solid var(--line);border-radius:999px;background:#fff;font-size:13px;font-weight:700;color:var(--ink-3);cursor:pointer;user-select:none;transition:.15s}
        .seg-opt img{width:16px;height:16px;object-fit:contain}
        .seg-opt .dot{width:9px;height:9px;border-radius:50%;background:#d8d0bd;flex-shrink:0}
        .seg-opt.on{border-color:var(--seg-c,#e8a013);color:var(--ink);background:color-mix(in srgb,var(--seg-c,#e8a013) 10%,#fff)}
        .seg-opt.on .dot{background:var(--seg-c,#e8a013)}
        .seg-opt.off-src{opacity:.55}
        .switch{display:flex;align-items:center;gap:10px;font-size:13px;color:var(--ink-2);font-weight:600;cursor:pointer;user-select:none}
        .switch input{display:none}
        .switch .track{width:42px;height:24px;border-radius:999px;background:#d8d0bd;position:relative;transition:.2s;flex-shrink:0}
        .switch .track::after{content:'';position:absolute;top:3px;left:3px;width:18px;height:18px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.25);transition:.2s}
        .switch input:checked + .track{background:var(--accent)}
        .switch input:checked + .track::after{left:21px}
        /* 卡片 */
        .mon-card{display:flex;gap:26px;align-items:flex-start}
        .art-side{flex-shrink:0;width:230px;text-align:center}
        .art-wrap{width:230px;height:230px;border-radius:18px;background:radial-gradient(circle at 50% 42%,#fdeec2,#f7ead0 72%);display:flex;align-items:center;justify-content:center;overflow:hidden;border:1px solid #f2e3b8;position:relative}
        .art-wrap img{max-width:210px;max-height:210px;transition:transform .25s}
        .art-wrap img:hover{transform:scale(1.06)}
        .src-badge{position:absolute;top:8px;left:8px;display:inline-flex;align-items:center;gap:5px;padding:3px 10px;border-radius:999px;color:#fff;font-size:11px;font-weight:800;text-shadow:0 1px 2px rgba(0,0,0,.15)}
        .mystery{font-size:64px;font-weight:800;color:#c9b98d}
        .no-tag{margin-top:8px;font-size:12px;color:var(--ink-3);font-weight:700;letter-spacing:1px}
        .info-side{flex:1;min-width:0}
        .mon-name{font-size:24px;font-weight:800;color:var(--ink);display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
        .mon-name small{font-size:13px;font-weight:600;color:var(--ink-3)}
        .genus{font-size:13px;color:var(--ink-3);margin:2px 0 10px}
        .chips{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:12px}
        .chip{padding:4px 13px;border-radius:999px;color:#fff;font-size:12px;font-weight:700;text-shadow:0 1px 2px rgba(0,0,0,.18)}
        .chip.plain{background:#c9b98d;text-shadow:none}
        .chip.tag-chip{background:linear-gradient(135deg,#e8b23a,#d19a2b);text-shadow:none;box-shadow:inset 0 0 0 1px rgba(255,255,255,.35)}
        .skill-list{margin-top:10px;display:flex;flex-direction:column;gap:7px}
        .skill-item{font-size:13px;background:#fbf6e8;border:1px solid var(--line);border-radius:12px;padding:7px 12px;line-height:1.5}
        .skill-item b{color:var(--ink)}
        .skill-item span{display:block;color:var(--ink-3);font-size:12px;margin-top:2px}
        .seal-list{margin-top:10px;display:flex;flex-direction:column;gap:7px}
        .seal-row{display:flex;gap:10px;align-items:flex-start;background:#f2f8fd;border:1px solid var(--line);border-radius:12px;padding:8px 12px}
        .seal-icon{width:44px;height:44px;object-fit:contain;flex:none;background:#fff;border-radius:8px;border:1px solid var(--line)}
        .seal-body{font-size:13px;line-height:1.5;min-width:0}
        .seal-body b{color:var(--ink)}
        .seal-body p{margin:3px 0 0;color:var(--ink-3);font-size:12px;white-space:pre-line;word-break:break-word}
        .src-line{margin-top:6px;font-size:11px;color:var(--ink-3);font-weight:700;text-align:center}
        .meta{font-size:13px;color:var(--ink-2);line-height:1.9;margin-bottom:12px}
        .meta b{color:var(--ink)}
        .dex-quote{background:#fbf6e8;border-left:4px solid var(--accent-2);border-radius:0 12px 12px 0;padding:12px 16px;font-size:13px;line-height:1.9;color:var(--ink-2)}
        .dex-quote .ver{display:inline-block;margin-top:6px;font-size:11px;color:var(--ink-3);font-weight:700}
        /* 进化链 */
        .evo-row{margin-top:16px}
        .evo-row h3{font-size:13px;color:var(--ink-3);font-weight:700;margin-bottom:8px}
        .evo-items{display:flex;flex-wrap:wrap;align-items:center;gap:6px}
        .evo-item{display:flex;flex-direction:column;align-items:center;gap:3px;width:76px;padding:6px 4px;border-radius:12px;border:1px solid var(--line);background:#fbf6e8;cursor:pointer;transition:.15s}
        .evo-item:hover{border-color:var(--accent)}
        .evo-item img{width:44px;height:44px;object-fit:contain}
        .evo-item span{font-size:11px;font-weight:700;color:var(--ink);text-align:center;line-height:1.3}
        .evo-arrow{color:#c9b98d;font-weight:800;font-size:14px}
        /* 种族值 */
        .stat-row{display:flex;align-items:center;gap:10px;margin-bottom:8px}
        .stat-label{width:44px;font-size:12px;font-weight:700;color:var(--ink-3);text-align:right;flex-shrink:0}
        .stat-bar{flex:1;height:12px;border-radius:999px;background:#f0e9d6;overflow:hidden}
        .stat-fill{height:100%;border-radius:999px;transition:width .5s ease}
        .stat-num{width:36px;font-size:12px;font-weight:800;color:var(--ink);font-variant-numeric:tabular-nums;flex-shrink:0}
        .stat-total{margin-top:10px;font-size:13px;color:var(--ink-2);text-align:right}
        .stat-total b{color:var(--ink);font-size:15px}
        /* 特性 / 技能卡 */
        .ex-card{display:flex;gap:20px;align-items:flex-start}
        .ex-icon{flex:none;width:86px;height:86px;border-radius:18px;background:radial-gradient(circle at 50% 40%,#fdeec2,#f7ead0 75%);border:1px solid #f2e3b8;display:flex;align-items:center;justify-content:center;font-size:34px;overflow:hidden;position:relative}
        .ex-icon img{width:100%;height:100%;object-fit:contain}
        .ex-icon .ex-src{position:absolute;bottom:5px;left:50%;transform:translateX(-50%);white-space:nowrap;color:#fff;font-size:12px;font-weight:800;padding:3px 12px;border-radius:999px;box-shadow:0 1px 4px rgba(0,0,0,.18)}
        .ex-body{flex:1;min-width:0}
        .ex-name{font-size:21px;font-weight:800;color:var(--ink);display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
        .ex-name small{font-size:12px;font-weight:600;color:var(--ink-3)}
        .ex-desc{margin-top:8px;font-size:13px;line-height:1.9;color:var(--ink-2);background:#fbf6e8;border-left:4px solid var(--accent-2);border-radius:0 12px 12px 0;padding:10px 14px;white-space:pre-line;word-break:break-word}
        .ex-empty{color:var(--ink-3);font-style:italic}
        .learners{margin-top:14px}
        .learners h3{font-size:13px;color:var(--ink-3);font-weight:700;margin-bottom:8px}
        .learner-list{display:flex;flex-wrap:wrap;gap:6px;max-height:150px;overflow-y:auto;padding-right:4px}
        .learner{padding:4px 11px;border-radius:999px;background:#fff;border:1px solid var(--line);font-size:12px;font-weight:700;color:var(--ink-2);cursor:pointer;transition:.15s}
        .learner:hover{border-color:var(--accent);color:var(--accent)}
        .learner.static{cursor:default}.learner.static:hover{border-color:var(--line);color:var(--ink-2)}
        .ex-note{margin-top:10px;font-size:11px;color:var(--ink-3)}
        .ex-attrs{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
        .ex-attrs span{font-size:12px;font-weight:700;color:var(--ink-2);background:#fbf6e8;border:1px solid var(--line);padding:4px 11px;border-radius:999px}
        .ex-btns{display:flex;gap:10px;flex-wrap:wrap;margin-top:14px}
        @media(max-width:640px){
            .ex-card{flex-direction:column;gap:12px}
            .ex-icon{margin:0 auto}
        }
        /* 灵感提示 */
        .tips{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:14px}
        .tip{background:#fbf6e8;border:1px solid #f2e3b8;border-radius:14px;padding:16px 18px}
        .tip h3{font-size:14px;color:var(--ink);margin-bottom:8px;display:flex;align-items:center;gap:8px}
        .tip h3 i{color:var(--accent);font-size:13px}
        .tip p{font-size:13px;line-height:1.9;color:var(--ink-2)}
        .loading{padding:50px 0;text-align:center;color:var(--ink-3);font-size:14px}
        .loading i{font-size:22px;color:var(--accent);animation:spin 1s linear infinite;display:block;margin-bottom:12px}
        @keyframes spin{to{transform:rotate(360deg)}}
        .foot{font-size:12px;color:var(--ink-3);text-align:center;line-height:1.8;margin-top:6px}
        .foot a{color:var(--accent);text-decoration:none;font-weight:700}
        @media(max-width:640px){
            .page{padding:18px 12px 60px}
            .hero{padding:20px 16px}.hero h1{font-size:22px}
            .sec{padding:16px 14px;border-radius:14px}
            .mon-card{flex-direction:column;align-items:stretch;gap:14px}
            .art-side{width:100%}.art-wrap{margin:0 auto;width:200px;height:200px}
            .art-wrap img{max-width:170px;max-height:170px}
            .seg-opt{padding:6px 11px;font-size:12px}
            .tip{padding:13px 14px}
            .evo-item{width:64px}.evo-item img{width:36px;height:36px}
        }
    </style>
</head>
<body>
<div id="site-navbar"></div>
<div id="app" v-cloak>
<div class="page">
    <div class="hero">
        <h1><i class="fa-solid fa-lightbulb"></i> 每日精灵灵感</h1>
        <p>每天从宝可梦、洛克王国、奥奇传说、赛尔号里各抽一只精灵、一个特性、一个技能做参考——看它们的属性、种族值、效果、可学精灵和进化链，再根据随机提示原创一只属于你的誓约精灵。数据全部离线生成、无需 AI。关掉「显示参考」可以玩盲盒模式：只看提示不剧透。点特性/技能下的精灵名，可跳到那只精灵的卡片。</p>
    </div>

    <div class="loading" v-if="state==='loading'"><i class="fa-solid fa-spinner"></i>正在加载精灵数据库…</div>
    <div class="loading" v-else-if="state==='error'">
        <i class="fa-solid fa-triangle-exclamation" style="animation:none"></i>
        加载失败：{{ errMsg }}
        <div style="margin-top:14px"><button class="btn primary" @click="loadData">重新加载</button></div>
    </div>

    <template v-else>
        <section class="sec">
            <div class="toolbar">
                <div class="src-seg">
                    <span class="seg-opt" v-for="s in srcList" :key="s.key"
                          :class="{on: srcOn[s.key], 'off-src': !s.loaded}"
                          :style="{'--seg-c': s.color}"
                          @click="toggleSrc(s)">
                        <span class="dot"></span>{{ s.label }}
                        <b>{{ s.count || 0 }}</b>
                        <span v-if="!s.loaded" style="font-weight:600;font-size:11px">（未加载）</span>
                    </span>
                </div>
                <button class="btn primary" @click="randomOne"><i class="fa-solid fa-dice"></i> 随机一只</button>
                <button class="btn" @click="backToToday" v-if="!isDaily"><i class="fa-regular fa-calendar"></i> 回到今日精灵</button>
                <label class="switch">
                    <span>{{ showRef ? '显示参考' : '盲盒模式' }}</span>
                    <input type="checkbox" v-model="showRef">
                    <span class="track"></span>
                </label>
                <label class="switch">
                    <span>排除已参照{{ excludedCount ? '（' + excludedCount + ' 只）' : '' }}</span>
                    <input type="checkbox" v-model="skipRef">
                    <span class="track"></span>
                </label>
            </div>
            <div class="genus" style="margin:0 0 16px">「排除已参照」依据图鉴里每只誓约精灵的【原型】字段：凡写了对应名字（如圆笙童子的原型「宝可梦-圆法师」），它就不会再出现在随机结果里，直到你清掉那行原型。</div>

            <div class="mon-card" v-if="mon.src">
                <div class="art-side">
                    <div class="art-wrap">
                        <span class="src-badge" :style="{background:srcMeta[mon.src].color}">
                            <img v-if="srcMeta[mon.src].favicon" :src="srcMeta[mon.src].favicon" alt="" @error="$event.target.style.display='none'" style="width:12px;height:12px;object-fit:contain">
                            {{ srcMeta[mon.src].label }}
                        </span>
                        <img v-if="showRef && mon.img" :src="mon.img" :alt="mon.name" loading="lazy" @error="artFallback">
                        <span v-else class="mystery">?</span>
                    </div>
                    <div class="no-tag">{{ mon.no ? 'No.' + mon.no : '编号 ' + mon.id }}</div>
                    <div class="src-line">出自 · {{ srcMeta[mon.src].label }}</div>
                </div>
                <div class="info-side">
                    <template v-if="showRef">
                        <div class="mon-name">{{ mon.name }}<small v-if="mon.en">{{ mon.en }}</small></div>
                        <div class="genus" v-if="mon.genus">{{ mon.genus }}</div>
                        <div class="chips" v-if="mon.types.length || mon.region || (mon.tags && mon.tags.length)">
                            <span class="chip" v-for="t in mon.types" :key="t" :style="{background:typeColor(mon,t)}">{{ t }}</span>
                            <span class="chip plain" v-if="mon.region">{{ mon.region }}地区</span>
                            <span class="chip tag-chip" v-for="tg in mon.tags" :key="tg">{{ tg }}</span>
                        </div>
                        <div class="meta" v-if="mon.h || mon.w">
                            <template v-if="mon.h">身高 <b>{{ mon.h }}</b></template>
                            <template v-if="mon.h && mon.w"> ／ </template>
                            <template v-if="mon.w">体重 <b>{{ mon.w }}</b></template>
                        </div>
                        <div class="chips" v-if="mon.talent || mon.hobby" style="margin-top:10px">
                            <span class="chip plain" v-if="mon.talent">特长 · {{ mon.talent }}</span>
                            <span class="chip plain" v-if="mon.hobby">爱好 · {{ mon.hobby }}</span>
                        </div>
                        <div class="chips" v-if="mon.abilities && mon.abilities.length" style="margin-top:10px">
                            <span class="chip plain" v-for="a in mon.abilities" :key="'ab'+a.name">特性 · {{ a.name }}<i v-if="a.hidden" style="font-style:normal;color:var(--accent)">（隐藏）</i></span>
                        </div>
                        <div class="skill-list" v-if="mon.skills && mon.skills.length">
                            <div class="skill-item" v-for="s in mon.skills" :key="s.k">
                                <b>{{ s.k }}「{{ s.v }}」</b>
                                <span v-if="s.fx">{{ s.fx }}</span>
                            </div>
                        </div>
                        <div class="seal-list" v-if="mon.soulSeal && mon.soulSeal.length">
                            <div class="seal-row" v-for="(ss,si) in mon.soulSeal" :key="'ss'+si">
                                <img v-if="ss.icon" class="seal-icon" :src="ss.icon" alt="魂印" loading="lazy" @error="$event.target.style.display='none'">
                                <div class="seal-body">
                                    <b>专属魂印</b>
                                    <p>{{ ss.effect }}</p>
                                </div>
                            </div>
                        </div>
                        <div class="seal-list" v-if="mon.engrave && mon.engrave.length">
                            <div class="seal-row" v-for="(eg,gi) in mon.engrave" :key="'eg'+gi">
                                <img v-if="eg.icon" class="seal-icon" :src="eg.icon" alt="刻印" loading="lazy" @error="$event.target.style.display='none'">
                                <div class="seal-body">
                                    <b>专属刻印<template v-if="eg.name"> · {{ eg.name }}</template></b>
                                    <p>{{ eg.desc }}</p>
                                </div>
                            </div>
                        </div>
                        <div class="dex-quote" v-if="mon.dex">「{{ mon.dex }}」<br><span class="ver" v-if="mon.dexSrc">——{{ mon.dexSrc }}</span></div>
                        <div class="dex-quote" v-else style="margin-top:12px">这只精灵暂无图鉴介绍。<a v-if="mon.link" :href="mon.link" target="_blank" rel="noopener" style="color:var(--accent);font-weight:700">去来源页面查看 →</a></div>
                    </template>
                    <template v-else>
                        <div class="mon-name">？？？<small>隐藏的参考精灵</small></div>
                        <div class="genus">下面的灵感提示就是根据它生成的——先别偷看，试着直接创作。</div>
                    </template>

                    <div v-if="showRef && mon.stats.length" style="margin-top:16px">
                        <div class="stat-row" v-for="s in mon.stats" :key="s.zh">
                            <span class="stat-label">{{ s.zh }}</span>
                            <div class="stat-bar"><div class="stat-fill" :style="{width:(s.v/255*100)+'%',background:statColor(s.v)}"></div></div>
                            <span class="stat-num">{{ s.v }}</span>
                        </div>
                        <div class="stat-total" v-if="mon.total">种族值合计 <b>{{ mon.total }}</b></div>
                    </div>

                    <div class="evo-row" v-if="showRef && mon.evo.length > 1">
                        <h3>进化链 <span style="font-size:11px;color:var(--ink-3);font-weight:600;margin-left:6px">点击成员可查看它的卡片</span></h3>
                        <div class="evo-items">
                            <template v-for="(ev,ei) in mon.evo" :key="ev.name+ei">
                                <span class="evo-arrow" v-if="ei > 0">→</span>
                                <span class="evo-item" :title="'查看 ' + ev.name" @click="jumpEvo(ev)">
                                    <img v-if="ev.img" :src="ev.img" :alt="ev.name" loading="lazy" @error="$event.target.style.display='none'">
                                    <span>{{ ev.name }}</span>
                                </span>
                            </template>
                        </div>
                    </div>
                </div>
            </div>

            <div class="loading" v-else style="padding:24px 0">当前选中的数据源里没有精灵，去上面点亮至少一个。</div>
        </section>

        <!-- 每日特性卡 -->
        <section class="sec">
            <h2><i class="fa-solid fa-sparkles"></i> 每日特性
                <span style="font-size:11px;color:var(--ink-3);font-weight:600;margin-left:6px">来自四源 · {{ abCount }} 条 · 点精灵名可跳它的卡</span>
            </h2>
            <div class="toolbar">
                <button class="btn primary" @click="randomAbility"><i class="fa-solid fa-dice"></i> 随机特性</button>
                <button class="btn" @click="backTodayAbility" v-if="!isDailyAbility"><i class="fa-regular fa-calendar"></i> 回到今日特性</button>
            </div>

                    <i v-else class="fa-solid fa-bolt" style="color:#c9b98d"></i>
                    <span class="ex-src" :style="{background:srcMeta[skill.src].color}">{{ srcMeta[skill.src].label }}</span>

                <div class="ex-body">

            <a href="https://rocokingdomworld.org/zh/pokedex/" target="_blank" rel="noopener">洛克王国世界图鉴</a>（{{ srcMeta.rk.count }} 只）·
            <a href="http://aoqi.100bt.com/jingling/daquan_list.html" target="_blank" rel="noopener">奥奇传说精灵大全</a>（{{ srcMeta.aq.count }} 只）·

<script>
const { createApp, ref, computed, onMounted, watch } = Vue;

/* ---------------- 数据源元信息 ---------------- */
const SRC_META = {
    pk: { label: '宝可梦',   color: '#e8a013', favicon: 'https://pokeapi.co/favicon.ico' },
    rk: { label: '洛克王国', color: '#3b82f6', favicon: 'https://rocokingdomworld.org/favicon.svg' },
    aq: { label: '奥奇传说', color: '#8b5cf6', favicon: '' },
    se: { label: '赛尔号',   color: '#0ea5e9', favicon: 'https://wiki.biligame.com/seer/favicon.ico' }
};
/* 各源种族值标签 */
const STAT_LABELS = {
    pk: { hp: 'HP', atk: '攻击', def: '防御', spa: '特攻', spd: '特防', spe: '速度' },
    rk: { hp: '生命', atk: '物攻', mag: '魔攻', def: '物防', res: '魔防', spe: '速度' },
    se: { hp: '体力', atk: '攻击', def: '防御', sa: '特攻', sd: '特防', spe: '速度' }
};
const STAT_ORDER = { pk: ['hp','atk','def','spa','spd','spe'], rk: ['hp','atk','mag','def','res','spe'], se: ['hp','atk','def','sa','sd','spe'] };
/* 宝可梦 18 系配色 */
const PK_TYPE_COLORS = {
    '一般':'#9FA19F','火':'#E62829','水':'#2980EF','电':'#FAC000','草':'#3FA129','冰':'#3DCEF3',
    '格斗':'#FF8000','毒':'#9141CB','地面':'#915121','飞行':'#81B9EF','超能力':'#EF4179','虫':'#91A119',
    '岩石':'#AFA981','幽灵':'#704170','龙':'#5060E1','恶':'#50415F','钢':'#60A1B8','妖精':'#EF70EF'
};

function statColor(v) {
    if (v >= 150) return '#3fa129';
    if (v >= 120) return '#57c422';
    if (v >= 90)  return '#9acd32';
    if (v >= 60)  return '#f6c453';
    if (v >= 40)  return '#ef8f4a';
    return '#e06060';
}

/* ---------------- 可复现的随机（每日同一结果） ---------------- */
function hashStr(str) {
    let h = 1779033703 ^ str.length;
    for (let i = 0; i < str.length; i++) {
        h = Math.imul(h ^ str.charCodeAt(i), 3432918353);
        h = (h << 13) | (h >>> 19);
    }
    return (h >>> 0);
}
function mulberry32(seed) {
    let a = seed >>> 0;
    return function () {
        a |= 0; a = (a + 0x6D2B79F5) | 0;
        let t = Math.imul(a ^ (a >>> 15), 1 | a);
        t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
        return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
}
function todayStr() {
    const d = new Date();
    return d.getFullYear() + '-' + ('0' + (d.getMonth() + 1)).slice(-2) + '-' + ('0' + d.getDate()).slice(-2);
}

/* ---------------- 灵感提示模板（按可用字段生成） ---------------- */
function buildTipPool(pet) {
    const pool = [];
    const stats = pet.stats || [];
    const statTop = stats.length ? stats.reduce((a, b) => (a.v >= b.v ? a : b)) : null;
    const statLow = stats.length ? stats.reduce((a, b) => (a.v <= b.v ? a : b)) : null;
    const type = pet.types && pet.types[0] ? pet.types[0] : '';
    const genus = pet.genus || '';
    const dexShort = pet.dex ? String(pet.dex).slice(0, 46) : '';

    if (type) {
        pool.push({ title: '属性意象', text: '它的核心属性是「' + type + '」。围绕这个属性构思一只全新的誓约精灵：它的外表、栖息环境、招牌技能分别是什么？' });
        pool.push({ title: '属性组合', text: '试试给它加一个第二属性：' + type + '+X 会变得更强还是更奇怪？为你的原创精灵选一个少见但说得通的属性组合。' });
    }
    if (pet.region) {
        pool.push({ title: '地区迁移', text: '它登记在' + pet.region + '地区。把同一种生态搬到完全不同的环境（雪山、深海、废都）里，它会演化成什么样？那就是你的原创精灵。' });
    }
    if (statTop) {
        pool.push({ title: '强项放大', text: '它最突出的是' + statTop.zh + '（' + statTop.v + '）。让你的原创精灵把这一点推到极致——极端的速度、极端的防御或极端的爆发，各会催生什么样的战斗方式？' });
        pool.push({ title: '反向设计', text: '它最弱的一项是' + statLow.zh + '（' + statLow.v + '）。反过来做一只这一项极强、其他平庸的精灵，只用一招立足——这样的精灵该怎么设计？' });
    }
    if (pet.total) {
        pool.push({ title: '数值预算', text: '它的种族值合计 ' + pet.total + '。给你的原创精灵也定一个相近的预算，各项加起来不超过它，强度节奏会更贴近原作。' });
    }
    pool.push({
        title: '称号法',
        text: genus
            ? '它被称作「' + genus + '」。先给你的原创精灵起一个两个字的称号（如「雾行」「磷火」），称号定了，形象往往自己就浮现出来。'
            : '先给你的原创精灵起一个两个字的称号（如「雾行」「磷火」），称号定了，形象往往自己就浮现出来。'
    });
    pool.push({ title: '契约视角', text: '如果一位御兽师与它缔结契约，誓词会怎么写？用一句誓词概括它最打动人的特质，再把同样的特质移植给你的原创精灵。' });
    if (dexShort) {
        pool.push({ title: '图鉴放大', text: '图鉴说：「' + dexShort + '…」。从这句话里挑一个画面感最强的细节，放大成你的原创精灵的核心设定。' });
    }
    if (pet.h) {
        pool.push({ title: '体型推演', text: '它身高体重约 ' + pet.h + (pet.w ? '／' + pet.w : '') + '。你的原创精灵更庞大还是更娇小？体型直接决定它的战斗方式与生态位。' });
    }
    if (pet.evo && pet.evo.length > 1) {
        const names = pet.evo.map(e => e.name).join(' → ');
        pool.push({ title: '进化推演', text: '它属于「' + names + '」这条进化链。你的原创精灵会长成什么样？倒推它的幼年形态或最终形态，往往就是一只新精灵的雏形。' });
    }
    if (pet.talent) {
        pool.push({ title: '特长视角', text: '它的战斗特长是「' + pet.talent + '」。让你的原创精灵也走这个特长，再用完全不同的属性去演绎——同一套打法会有什么新花样？' });
    }
    if (pet.abilities && pet.abilities.length) {
        const an = pet.abilities.map(a => a.name).join('、');
        pool.push({ title: '特性改编', text: '它的特性是「' + an + '」。给你的原创精灵设计一个全新特性：名字、触发条件、效果各一句话——特性往往比技能更能定义一只精灵。' });
    }
    if (pet.soulSeal && pet.soulSeal.length) {
        const fx = String(pet.soulSeal[0].effect).replace(/\s+/g, ' ').slice(0, 60);
        pool.push({ title: '专属印记', text: '它有一枚专属魂印：「' + fx + '…」。给你的原创精灵也设计一枚专属印记——不用多，一条刻进骨头里的特殊规则就够。' });
    }
    if (pet.skills && pet.skills.length) {
        const s0 = pet.skills[0].v, s1 = pet.skills[pet.skills.length - 1].v;
        pool.push({
            title: '技能进阶',
            text: s1 !== s0
                ? '它的技能从「' + s0 + '」进阶到「' + s1 + '」——名字里能看到成长的痕迹。给你的原创精灵也设计一组普通技与超杀技，让技能名自己讲故事。'
                : '它的招牌技能是「' + s0 + '」。给你的原创精灵设计一个技能名：两个字太直白，四个字太啰嗦，试试三个字或一个动作短语。'
        });
    }
    if (pet.hobby) {
        pool.push({ title: '反差萌', text: '战斗之外的它有个爱好：' + pet.hobby + '。给你的原创精灵也加一个与战斗力无关的小爱好——性格立刻就立体了。' });
    }
    pool.push({ title: '场景法', text: '不看任何参考，直接写一个场景：清晨、废墟、暴雨。你的原创精灵就藏在这个场景里——它此刻在做什么？' });
    if (pool.length < 3) {
        pool.push({ title: '命名法', text: '从它的名字里挑一个字，配一个新字组成你的精灵名，再围绕新名字设计外形与习性。' });
        pool.push({ title: '招牌技能', text: '为你的原创精灵设计一个招牌技能：名字、属性、效果各一句话。技能定了，精灵的战斗风格就立起来了。' });
        pool.push({ title: '相遇故事', text: '写一段你的主角与这只原创精灵初次相遇的故事。相遇方式往往能反推出它的性格与习性。' });
    }
    return pool;
}

createApp({
    setup() {
        const state = ref('loading');
        const errMsg = ref('');
        const showRef = ref(localStorage.getItem('vowmon_daily_show') !== 'false');
        // 排除已参照：图鉴 vow 的【原型】(origin) 写了对应名字的，不再随机出现
        const skipRef = ref(localStorage.getItem('vowmon_daily_skip_ref') !== 'false');
        const excludedNames = ref(new Set());
        // 数据源开关（默认只开宝可梦；洛克/奥奇数据是外部来源，由用户自己点亮）
        const srcOn = ref(JSON.parse(localStorage.getItem('vowmon_daily_src') || '{"pk":true,"rk":false,"aq":false,"se":false}'));
        // 初始化必须带 SRC_META 的 label/color/favicon，否则卡片「出自 ·」和徽章是空的
        const srcMeta = ref(Object.fromEntries(Object.entries(SRC_META).map(([k, v]) => [k, { ...v, count: 0 }])));
        const srcList = computed(() => ['pk', 'rk', 'aq', 'se'].map(k => ({
            key: k, label: SRC_META[k].label, color: SRC_META[k].color,
            loaded: srcMeta.value[k].count > 0, count: srcMeta.value[k].count
        })));
        const dailyIdx = ref(0);
        const curIdx = ref(0);
        const tipSeed = ref(0);
        const artFallbackUsed = ref(false);
        const allPets = ref([]);        // 归一化后的全部精灵（三源合并）
        const allAbilities = ref([]);   // 特性库（四源）
        const allSkills = ref([]);      // 技能库（四源）
        const abIdx = ref(0), skIdx = ref(0);
        const dailyAbIdx = ref(0), dailySkIdx = ref(0);

        const excludedCount = computed(() => allPets.value.filter(p => excludedNames.value.has(p.name)).length);
        /* 特性/技能随机池：按数据源开关过滤 */
        const abPool = computed(() => allAbilities.value.filter(a => srcOn.value[a.src]));
        const skPool = computed(() => allSkills.value.filter(s => srcOn.value[s.src]));
        const abCount = computed(() => abPool.value.length);
        const skCount = computed(() => skPool.value.length);
        const ability = computed(() => abPool.value[abIdx.value] || { src: '', name: '', desc: '', learners: [] });
        const skill = computed(() => skPool.value[skIdx.value] || { src: '', name: '', desc: '', learners: [] });
        const isDailyAbility = computed(() => abIdx.value === dailyAbIdx.value);
        const isDailySkill = computed(() => skIdx.value === dailySkIdx.value);
        const pool = computed(() => {
            const on = srcOn.value;
            let list = allPets.value.filter(p => on[p.src]);
            if (skipRef.value && excludedNames.value.size) {
                list = list.filter(p => !excludedNames.value.has(p.name));
            }
            return list;
        });
        const mon = computed(() => pool.value[curIdx.value] || { src: '', types: [], stats: [], evo: [], talent: '', skills: [], hobby: '', abilities: [], soulSeal: [], engrave: [] });
        const isDaily = computed(() => curIdx.value === dailyIdx.value);
        const tips = computed(() => {
            const p = buildTipPool(mon.value);
            const rng = mulberry32(hashStr('tips-' + tipSeed.value));
            const copy = p.slice();
            for (let i = copy.length - 1; i > 0; i--) {
                const j = Math.floor(rng() * (i + 1));
                const t = copy[i]; copy[i] = copy[j]; copy[j] = t;
            }
            return copy.slice(0, 3);
        });

        function typeColor(pet, t) {
            return (pet.typeColors && pet.typeColors[t]) || PK_TYPE_COLORS[t] || '#c9b98d';
        }
        /* 立绘加载失败：赛尔号换头像兜底（只换一次，再失败就隐藏图片） */
        function artFallback() {
            const pet = pool.value[curIdx.value];
            if (pet && pet.src === 'se' && pet.imgFallback) {
                pet.img = pet.imgFallback;
                pet.imgFallback = '';
                return;
            }
            artFallbackUsed.value = true;
        }

        /* 点进化链成员：切到那只精灵的卡片（在当前随机池里按名字找；奥奇本体名可能带版本前缀，做兜底匹配） */
        function jumpEvo(ev) {
            const n = ev.name;
            let i = pool.value.findIndex(p => p.name === n);
            if (i < 0) {
                // 兜底：奥奇列表里的 full 名（去 [版本] 前缀）与表格阶段名相等
                const strip = s => String(s || '').replace(/^\[[^\]]*\]/, '').trim();
                i = pool.value.findIndex(p => p.full && strip(p.full) === n);
            }
            if (i < 0) return;
            curIdx.value = i;
            tipSeed.value = (Math.random() * 4294967296) >>> 0;
            artFallbackUsed.value = false;
        }

        /* 当前开关组合的签名：决定今日精灵的随机种子 */
        function sig() {
            const on = ['pk', 'rk', 'aq', 'se'].filter(k => srcOn.value[k]).join('-');
            return (on || 'none') + '|' + (skipRef.value ? 'skip' : 'all');
        }
        function reseedDaily() {
            const n = pool.value.length;
            if (!n) return;
            const rng = mulberry32(hashStr('vowmon-daily-' + todayStr() + '-' + sig()));
            dailyIdx.value = Math.floor(rng() * n);
            curIdx.value = dailyIdx.value;
            tipSeed.value = hashStr('daily-' + todayStr() + '-' + sig());
            artFallbackUsed.value = false;
            const na = abPool.value.length, ns = skPool.value.length;
            if (na) {
                const ra = mulberry32(hashStr('vowmon-daily-ab-' + todayStr() + '-' + sig()));
                dailyAbIdx.value = Math.floor(ra() * na); abIdx.value = dailyAbIdx.value;
            }
            if (ns) {
                const rs = mulberry32(hashStr('vowmon-daily-sk-' + todayStr() + '-' + sig()));
                dailySkIdx.value = Math.floor(rs() * ns); skIdx.value = dailySkIdx.value;
            }
        }
        function randomAbility() {
            const n = abPool.value.length;
            if (!n) return;
            let next = abIdx.value;
            while (next === abIdx.value && n > 1) next = Math.floor(Math.random() * n);
            abIdx.value = next;
        }
        function randomSkill() {
            const n = skPool.value.length;
            if (!n) return;
            let next = skIdx.value;
            while (next === skIdx.value && n > 1) next = Math.floor(Math.random() * n);
            skIdx.value = next;
        }
        function backTodayAbility() { abIdx.value = dailyAbIdx.value; }
        function backTodaySkill() { skIdx.value = dailySkIdx.value; }
        /* 点特性/技能的可学精灵：跳到对应精灵卡（跨池按名字/编号找） */
        function jumpLearner(l) {
            let i = pool.value.findIndex(p => p.name === l.name || p.id === l.id || p.no === l.id);
            if (i < 0) {
                const strip = s => String(s || '').replace(/^\[[^\]]*\]/, '').trim();
                i = pool.value.findIndex(p => p.full && strip(p.full) === l.name);
            }
            if (i < 0) return;
            curIdx.value = i;
            tipSeed.value = (Math.random() * 4294967296) >>> 0;
            document.querySelector('.mon-card').scrollIntoView({ behavior: 'smooth', block: 'start' });
        }

        /* 扫描图鉴 vow 的【原型】字段，找出已被参照的精灵名（三源通用） */
        function scanPrototypes() {
            const vows = window.allVowsData || [];
            const found = new Set();
            for (const v of vows) {
                const o = String((v && (v.origin || v['原型'])) || '');
                if (!o) continue;
                const oLow = o.toLowerCase();
                for (const p of allPets.value) {
                    if (o.indexOf(p.name) !== -1 ||
                        (p.en && oLow.indexOf(p.en.toLowerCase()) !== -1) ||
                        (p.full && o.indexOf(p.full) !== -1)) {
                        found.add(p.name);
                    }
                }
            }
            excludedNames.value = found;
        }

        /* 单个数据源的取数（三源顺序兜底），失败返回 null（不阻塞其它源） */
        async function fetchSource(file) {
            const cfg = window.VOWMON_SITE_CONFIG || {};
            const bases = [
                String(cfg.dataCdnBase || '').replace(/\/+$/, ''),
                'https://cdn.jsdelivr.net/gh/luo029/vowmon_data@main',
                'https://raw.githubusercontent.com/luo029/vowmon_data/main'
            ].filter(Boolean);
            let lastErr = null;
            for (const base of bases) {
                try {
                    const res = await fetch(base + '/' + file + '?_=20261128b', { cache: 'no-store' });
                    if (!res.ok) { lastErr = base + ' HTTP ' + res.status; continue; }
                    const obj = await res.json();
                    if (obj && typeof obj === 'object') return obj;
                    lastErr = base + ' 数据为空';
                } catch (e) { lastErr = String(e && e.message || e); }
            }
            console.warn(file + ' 加载失败：' + lastErr);
            return null;
        }

        function normalizePk(data) {
            const byId = {};
            for (const p of data.pokemon) byId[p.id] = p;
            return data.pokemon.map(p => {
                const labels = STAT_LABELS.pk, order = STAT_ORDER.pk;
                const stats = order.filter(k => p.stats[k] != null).map(k => ({ zh: labels[k], v: p.stats[k] }));
                return {
                    src: 'pk', id: p.id, no: p.no, name: p.name, en: p.en, genus: p.genus,
                    types: p.types || [], typeColors: null, region: p.region || '', tags: p.tags || [],
                    stats: stats, total: p.total || 0,
                    abilities: (p.abilities || []).map(a => ({ name: a.name, hidden: !!a.hidden })),
                    h: p.h ? (p.h / 10).toFixed(1) + ' m' : '', w: p.w ? (p.w / 10).toFixed(1) + ' kg' : '',
                    dex: p.dex || '', dexVer: p.dexVer || '', dexSrc: p.dex ? '《' + p.dexVer + '》图鉴介绍' : '',
                    img: 'https://cdn.jsdelivr.net/gh/PokeAPI/sprites@master/sprites/pokemon/other/official-artwork/' + p.id + '.png',
                    evo: (p.evo || []).map(id => byId[id] ? { name: byId[id].name, img: 'https://cdn.jsdelivr.net/gh/PokeAPI/sprites@master/sprites/pokemon/other/official-artwork/' + id + '.png' } : null).filter(Boolean),
                    link: '', full: ''
                };
            });
        }
        function normalizeRk(data) {
            return (data.pets || []).map(p => {
                const labels = STAT_LABELS.rk, order = STAT_ORDER.rk;
                const stats = order.filter(k => p.stats && p.stats[k] != null).map(k => ({ zh: labels[k], v: p.stats[k] }));
                return {
                    src: 'rk', id: p.id, no: (p.no || '').replace(/^NO/, ''), name: p.name, en: p.en || '',
                    genus: '', types: p.types || [], typeColors: p.typeColors || {}, region: '',
                    stats: stats, total: p.total || 0, h: p.h || '', w: p.w || '',
                    abilities: [], soulSeal: [], engrave: [],
                    dex: p.dex || '', dexVer: '', dexSrc: p.dex ? '图鉴描述' : '',
                    img: p.img || '', evo: p.evo || [], link: 'https://rocokingdomworld.org/zh/pokedex/' + p.id, full: ''
                };
            });
        }
        function normalizeAq(data) {
            return (data.pets || []).map(p => {
                // 技能对（普通技/超杀技，带特效文本），「无」视为没有
                const skills = [
                    { k: '普通技', v: p.skill && p.skill !== '无' ? p.skill : '', fx: p.skillFx && p.skillFx !== '无' ? p.skillFx : '' },
                    { k: '超杀技', v: p.ult && p.ult !== '无' ? p.ult : '', fx: p.ultFx && p.ultFx !== '无' ? p.ultFx : '' }
                ].filter(x => x.v);
                return {
                    src: 'aq', id: p.id, no: '', name: p.name, en: '', genus: '',
                    types: p.type ? [p.type] : [], typeColors: {}, region: '',
                    stats: [], total: 0, h: p.h || '', w: p.w || '',
                    abilities: [], soulSeal: [], engrave: [],
                    dex: p.dex || '', dexSrc: p.dex ? '成长故事' : '',
                    talent: p.talent || '', skills: skills, hobby: p.hobby || '',
                    img: p.img || '', evo: (p.evo || []).map(n => ({ name: n, img: '' })),
                    link: p.link || '', full: p.full || ''
                };
            });
        }
        function normalizeSeer(data) {
            const byName = {}, byNo = {};
            for (const p of (data.pets || [])) { byName[p.name] = p; byNo[p.no] = p; }
            return (data.pets || []).map(p => {
                const labels = STAT_LABELS.se, order = STAT_ORDER.se;
                const stats = order.filter(k => p.stats[k] != null).map(k => ({ zh: labels[k], v: p.stats[k] }));
                return {
                    src: 'se', id: p.no, no: p.no, name: p.name, en: p.alias || '', genus: '',
                    types: p.type ? [p.type] : [], typeColors: {}, region: '',
                    stats: stats, total: p.total || 0,
                    abilities: [], soulSeal: (p.soulSeal || []).map(s => ({ icon: s.icon || '', effect: s.effect || '' })),
                    engrave: (p.engrave || []).map(g => ({ icon: g.icon || '', name: g.name || '', desc: g.desc || '' })),
                    h: p.h ? String(p.h).replace(/\s*cm\s*$/, '') + ' cm' : '', w: p.w ? String(p.w).replace(/\s*kg\s*$/, '') + ' kg' : '',
                    dex: p.dex || '', dexSrc: p.dex ? '简介' : '',
                    img: p.img || '', imgFallback: p.imgFallback || '',
                    // 进化链条目可能是阶段名也可能是序号，都能反查
                    evo: (p.evo || []).map(n => {
                        const m = byName[n] || byNo[n];
                        return { name: m ? m.name : n, img: m ? m.img || '' : '' };
                    }),
                    link: p.link || '', full: ''
                };
            });
        }

        async function loadData() {
            state.value = 'loading'; errMsg.value = '';
            const [pk, rk, aq, se, abData, skData] = await Promise.all([
                fetchSource('pokemon-data.json'),
                fetchSource('rock-data.json'),
                fetchSource('aoqi-data.json'),
                fetchSource('seer-data.json'),
                fetchSource('inspiration-abilities.json'),
                fetchSource('inspiration-skills.json')
            ]);
            const pets = [];
            if (pk) { pets.push(...normalizePk(pk)); srcMeta.value.pk.count = (pk.pokemon || []).length; }
            if (rk) { pets.push(...normalizeRk(rk)); srcMeta.value.rk.count = (rk.pets || []).length; }
            if (aq) { pets.push(...normalizeAq(aq)); srcMeta.value.aq.count = (aq.pets || []).length; }
            if (se) { pets.push(...normalizeSeer(se)); srcMeta.value.se.count = (se.pets || []).length; }
            if (!pets.length) {
                state.value = 'error';
                errMsg.value = '三个数据源都拉取失败，请检查网络后重试';
                return;
            }
            allPets.value = pets;
            allAbilities.value = abData && Array.isArray(abData.items) ? abData.items : [];
            allSkills.value = skData && Array.isArray(skData.items) ? skData.items : [];
            state.value = 'ok';
            reseedDaily();
            // 静默加载图鉴数据，扫描【原型】字段构建「已参照」名单
            try {
                window.VowmonData.softReady(['vows']).then(function () {
                    scanPrototypes();
                    reseedDaily();
                }).catch(function () { /* 图鉴取不到就不排除 */ });
            } catch (e) { /* ignore */ }
        }

        function randomOne() {
            const n = pool.value.length;
            if (!n) return;
            let next = curIdx.value;
            while (next === curIdx.value && n > 1) {
                next = Math.floor(Math.random() * n);
            }
            curIdx.value = next;
            tipSeed.value = (Math.random() * 4294967296) >>> 0;
            artFallbackUsed.value = false;
        }
        function backToToday() {
            curIdx.value = dailyIdx.value;
            tipSeed.value = hashStr('daily-' + todayStr() + '-' + sig());
            artFallbackUsed.value = false;
        }
        function reshuffleTips() {
            tipSeed.value = (Math.random() * 4294967296) >>> 0;
        }
        function toggleSrc(s) {
            if (!s.loaded) return;
            srcOn.value[s.key] = !srcOn.value[s.key];
        }

        watch(showRef, v => { localStorage.setItem('vowmon_daily_show', v ? 'true' : 'false'); });
        watch(skipRef, v => { localStorage.setItem('vowmon_daily_skip_ref', v ? 'true' : 'false'); reseedDaily(); });
        watch(srcOn, v => { localStorage.setItem('vowmon_daily_src', JSON.stringify(v)); reseedDaily(); }, { deep: true });
        window.addEventListener('storage', e => {
            if (e.key === 'vowmon_daily_show') showRef.value = localStorage.getItem(e.key) !== 'false';
            if (e.key === 'vowmon_daily_skip_ref') skipRef.value = localStorage.getItem(e.key) !== 'false';
            if (e.key === 'vowmon_daily_src') {
                try { srcOn.value = JSON.parse(localStorage.getItem(e.key) || '{}'); } catch (e2) { /* ignore */ }
            }
        });

        onMounted(loadData);
        return {
            state, errMsg, showRef, skipRef, srcOn, srcMeta, srcList,
            mon, isDaily, tips, excludedCount,
            ability, skill, isDailyAbility, isDailySkill, abCount, skCount,
            typeColor, artFallback, statColor, loadData, randomOne, backToToday, reshuffleTips, toggleSrc,
            jumpEvo, randomAbility, randomSkill, backTodayAbility, backTodaySkill, jumpLearner
        };
    }
}).mount('#app');
</script>
</body>
</html>
